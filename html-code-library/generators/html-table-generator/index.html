<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Table Generator - SmartGen</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'DM Sans', sans-serif; 
            background-color: #0a1f1a !important; 
            color: #d1fae5 !important; 
        }
        .code-output { font-family: 'Space Mono', monospace; font-size: 12px; }
        .toast { animation: slideIn 0.3s ease, fadeOut 0.3s ease 2s forwards; }
        @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; } }
        
        .tab-btn { padding: 6px 16px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; background: transparent; color: #86efac; border: 1px solid transparent; }
        .tab-btn.active { background: #065f46; color: #86efac; border-color: #10b981; }
        .tab-btn:not(.active):hover { color: #bbf7d0; }
        
        .panel { 
            background-color: #0d2e24 !important; 
            border: 1px solid #1a5c45; 
            border-radius: 12px; 
            padding: 20px; 
        }
        
        .field-input { 
            width: 100%; 
            background-color: #071a14 !important; 
            border: 1px solid #1a5c45 !important; 
            border-radius: 8px; 
            padding: 8px 12px; 
            color: #ffffff !important; 
            font-size: 14px; 
            outline: none;
        }
        .field-input:focus { border-color: #34d399 !important; }
        
        .field-label { 
            display: block; 
            font-size: 13px; 
            font-weight: 500;
            color: #6ee7b7 !important; 
            margin-bottom: 6px; 
        }
    </style>
</head>
<body class="min-h-screen w-full">
    <div id="toast-container" class="fixed top-4 right-4 z-50"></div>
    <header class="border-b border-emerald-800/50 px-6 py-4">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <h1 class="font-bold text-lg text-emerald-200">HTML Table Generator</h1>
            <button id="reset-btn" class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-emerald-800 text-emerald-100 hover:bg-emerald-700 transition-colors text-sm font-medium"> 
                <i data-lucide="rotate-ccw" style="width:14px;height:14px"></i> Reset 
            </button>
        </div>
    </header>
    <main class="max-w-6xl mx-auto p-6">
        <div class="grid lg:grid-cols-2 gap-6">
            <div class="space-y-4">
                <section class="panel">
                    <h2 class="font-semibold text-emerald-100 mb-3">Table Settings</h2>
                    <div class="space-y-3">
                        <div>
                            <label class="field-label">Rows</label>
                            <input id="rows" type="number" value="3" min="1" max="20" class="field-input">
                        </div>
                        <div>
                            <label class="field-label">Columns</label>
                            <input id="cols" type="number" value="3" min="1" max="20" class="field-input">
                        </div>
                        <div>
                            <label class="field-label">Border Width (px)</label>
                            <input id="border" type="number" value="1" min="0" max="10" class="field-input">
                        </div>
                        <div>
                            <label class="field-label">Cell Padding (px)</label>
                            <input id="padding" type="number" value="8" min="0" max="20" class="field-input">
                        </div>
                    </div>
                </section>
                <section class="panel">
                    <h2 class="font-semibold text-emerald-100 mb-3">Colors</h2>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="field-label">Border Color</label>
                            <input id="border-color" type="color" value="#34d399" class="field-input h-10 p-1 cursor-pointer">
                        </div>
                        <div>
                            <label class="field-label">Header BG</label>
                            <input id="header-bg" type="color" value="#065f46" class="field-input h-10 p-1 cursor-pointer">
                        </div>
                        <div>
                            <label class="field-label">Header Text</label>
                            <input id="header-text" type="color" value="#d1fae5" class="field-input h-10 p-1 cursor-pointer">
                        </div>
                        <div>
                            <label class="field-label">Cell BG</label>
                            <input id="cell-bg" type="color" value="#0d2e24" class="field-input h-10 p-1 cursor-pointer">
                        </div>
                    </div>
                </section>
                <section class="panel">
                    <h2 class="font-semibold text-emerald-100 mb-3">Options</h2>
                    <div class="space-y-2">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input id="striped" type="checkbox" checked class="w-4 h-4">
                            <span class="text-sm text-emerald-200">Striped rows</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input id="hover" type="checkbox" checked class="w-4 h-4">
                            <span class="text-sm text-emerald-200">Hover effect</span>
                        </label>
                    </div>
                </section>
            </div>
            <div class="space-y-4">
                <section class="panel">
                    <h2 class="font-semibold text-emerald-100 mb-3">Preview</h2>
                    <div id="preview-box" class="bg-black/30 rounded-lg p-4 overflow-x-auto border border-emerald-800/50"></div>
                </section>
                <section class="panel">
                    <h2 class="font-semibold text-emerald-100 mb-3">Generated Code</h2>
                    <pre id="code-output" class="code-output bg-black/40 rounded-lg p-4 overflow-x-auto text-emerald-200 border border-emerald-800/50 min-h-[200px] whitespace-pre-wrap text-xs"></pre>
                    <div class="flex gap-3 mt-3">
                        <button id="copy-btn" class="flex items-center gap-2 px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-sm font-medium transition-colors"> 
                            <i data-lucide="copy" style="width:14px;height:14px"></i> Copy 
                        </button> 
                        <button id="download-btn" class="flex items-center gap-2 px-4 py-2 bg-emerald-800 hover:bg-emerald-700 text-emerald-100 rounded-lg text-sm font-medium transition-colors border border-emerald-700"> 
                            <i data-lucide="download" style="width:14px;height:14px"></i> Download 
                        </button>
                    </div>
                </section>
            </div>
        </div>
    </main>
    
    <script>
        lucide.createIcons();
        const $ = id => document.getElementById(id);

        document.querySelectorAll('input').forEach(el => {
            el.addEventListener('input', update);
            el.addEventListener('change', update);
        });

        function generateTable() {
            const rows = parseInt($('rows').value);
            const cols = parseInt($('cols').value);
            const border = parseInt($('border').value);
            const padding = parseInt($('padding').value);
            const borderColor = $('border-color').value;
            const headerBg = $('header-bg').value;
            const headerText = $('header-text').value;
            const cellBg = $('cell-bg').value;
            const striped = $('striped').checked;
            const hover = $('hover').checked;

            let html = `<table style="border-collapse: collapse; width: 100%; border: ${border}px solid ${borderColor};">\n`;
            
            // Header row
            html += '  <thead>\n    <tr>\n';
            for (let i = 0; i < cols; i++) {
                html += `      <th style="background-color: ${headerBg}; color: ${headerText}; padding: ${padding}px; border: ${border}px solid ${borderColor}; text-align: left; font-weight: bold;">Header ${i + 1}</th>\n`;
            }
            html += '    </tr>\n  </thead>\n';

            // Body rows
            html += '  <tbody>\n';
            for (let i = 0; i < rows; i++) {
                const bgColor = striped && i % 2 === 1 ? '#1a5c45' : cellBg;
                html += '    <tr>\n';
                for (let j = 0; j < cols; j++) {
                    html += `      <td style="background-color: ${bgColor}; padding: ${padding}px; border: ${border}px solid ${borderColor};">Cell ${i + 1}-${j + 1}</td>\n`;
                }
                html += '    </tr>\n';
            }
            html += '  </tbody>\n</table>';

            return html;
        }

        function update() {
            const code = generateTable();
            $('code-output').textContent = code;
            $('preview-box').innerHTML = code;
        }

        $('copy-btn').addEventListener('click', () => {
            navigator.clipboard.writeText($('code-output').textContent).then(() => showToast('Copied!'));
        });

        $('download-btn').addEventListener('click', () => {
            const blob = new Blob([`<!DOCTYPE html>\n<html><head><meta charset="UTF-8"></head><body>\n${$('code-output').textContent}\n</body></html>`], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'table.html';
            a.click();
        });

        $('reset-btn').addEventListener('click', () => {
            $('rows').value = '3';
            $('cols').value = '3';
            $('border').value = '1';
            $('padding').value = '8';
            $('border-color').value = '#34d399';
            $('header-bg').value = '#065f46';
            $('header-text').value = '#d1fae5';
            $('cell-bg').value = '#0d2e24';
            $('striped').checked = true;
            $('hover').checked = true;
            update();
        });

        function showToast(msg) {
            const t = document.createElement('div');
            t.className = 'toast bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-lg';
            t.textContent = msg;
            $('toast-container').appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }

        update();
    </script>
</body>
</html>
