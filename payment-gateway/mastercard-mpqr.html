<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartGen Mastercard MPQR Sandbox</title>
  <style>
    :root { color-scheme: dark; --bg:#080b12; --panel:#111827; --line:#283548; --text:#edf2f7; --muted:#9caac0; --blue:#00a9e0; --green:#20c997; --red:#ff8796; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font-family:Inter,system-ui,sans-serif; background:radial-gradient(circle at 10% 0%,#102c45 0,transparent 42%),var(--bg); color:var(--text); }
    main { width:min(100%,720px); } .panel { border:1px solid var(--line); background:var(--panel); border-radius:22px; padding:clamp(24px,5vw,44px); box-shadow:0 24px 80px #0007; }
    a { color:#75d8f7; } h1 { margin:12px 0; font-size:clamp(2rem,6vw,3.4rem); letter-spacing:-.05em; line-height:1; } p { color:var(--muted); line-height:1.65; } label { display:grid; gap:8px; margin-top:18px; font-weight:700; color:#c9d4e6; } input { width:100%; padding:13px 14px; border:1px solid var(--line); border-radius:11px; background:#0b111d; color:var(--text); font:inherit; } button { width:100%; margin-top:22px; padding:14px; border:0; border-radius:11px; background:linear-gradient(135deg,var(--blue),#0063a4); color:white; font:inherit; font-weight:800; cursor:pointer; } button:disabled { opacity:.6; cursor:wait; } pre { overflow:auto; white-space:pre-wrap; padding:16px; border:1px solid var(--line); border-radius:11px; background:#080d16; color:#b7e9f8; } .ok { color:#75e0bb; } .error { color:var(--red); } .eyebrow { color:#75d8f7; text-transform:uppercase; letter-spacing:.14em; font-size:.75rem; font-weight:800; }
  </style>
</head>
<body>
  <main><section class="panel">
    <a href="/payment-gateway/">← Back to SmartGen Checkout</a>
    <p class="eyebrow">Mastercard Merchant Presented QR</p>
    <h1>MPQR sandbox lab</h1>
    <p>This prototype calls SmartGen’s server-side Worker. It sends only a test amount and transfer reference from the browser. Mastercard OAuth signing keys remain on the Worker.</p>
    <form id="form">
      <label>Sandbox amount
        <input id="amount" type="number" min="0.01" step="0.01" value="51.00" required>
      </label>
      <label>Transfer reference
        <input id="reference" maxlength="40" value="SGMPQR_TEST_001" pattern="[A-Za-z0-9*._~-]{6,40}" required>
      </label>
      <button id="submit" type="submit">Create Mastercard sandbox transfer</button>
    </form>
    <p id="status" role="status"></p>
    <pre id="output" hidden></pre>
  </section></main>
  <script>
    const PAYMENT_WORKER_URL = window.SMARTGEN_PAYMENT_WORKER_URL || "https://smartgen-bkash-sandbox.workers.dev";
    const form = document.querySelector("#form");
    const button = document.querySelector("#submit");
    const status = document.querySelector("#status");
    const output = document.querySelector("#output");
    form.addEventListener("submit", async (event) => {
      event.preventDefault(); button.disabled = true; status.textContent = "Signing and sending sandbox request…"; status.className = ""; output.hidden = true;
      try {
        const response = await fetch(`${PAYMENT_WORKER_URL}/api/mastercard/mpqr/payment`, { method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({ amount:document.querySelector("#amount").value, transferReference:document.querySelector("#reference").value }) });
        const data = await response.json(); output.textContent = JSON.stringify(data, null, 2); output.hidden = false;
        if (!response.ok) throw new Error(data.error || "Mastercard sandbox request failed");
        status.textContent = "Sandbox transfer created. Save the returned transfer ID for retrieval."; status.className = "ok";
      } catch (error) { status.textContent = error.message; status.className = "error"; } finally { button.disabled = false; }
    });
  </script>
</body>
</html>
