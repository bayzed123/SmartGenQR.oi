<!-- Slim Minimalist Author Profile Box -->
<div class="author-box" style="display: flex; align-items: center; margin: 2rem 0; padding: 0.75rem 0; gap: 0.75rem;">
    <!-- Profile Picture -->
    <img src="https://raw.githubusercontent.com/bayzed123/SmartGenQR.oi/main/assets/smartgentools-blog-bayezid-profile.jpg" 
         alt="Sayad Md Bayezid Hosan" 
         style="width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex-shrink: 0;">
    
    <!-- Info -->
    <div class="author-info" style="flex: 1;">
        <!-- Byline, not a section heading. Marked up as a heading it sat directly
         after the post title and jumped two levels in the outline on every
         post, listing the author as though it were a chapter. -->
        <p class="author-name" style="margin: 0; color: #1e293b; font-size: 0.95rem; font-weight: 600;"><span itemprop="author" itemscope itemtype="https://schema.org/Person"><span itemprop="name">Sayad Md Bayezid Hosan</span></span></p>
        <p style="margin: 2px 0 0 0; color: #64748b; font-size: 0.8rem;">Tech Entrepreneur & Full-stack Developer</p>
    </div>
</div>
