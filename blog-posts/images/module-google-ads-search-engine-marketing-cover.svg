<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1526"/>
      <stop offset="100%" stop-color="#1B2A4A"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="dotGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <circle cx="1000" cy="140" r="150" fill="#4ED9AE" opacity="0.10" filter="url(#softGlow)"/>
  <circle cx="1080" cy="500" r="170" fill="#F1633C" opacity="0.08" filter="url(#softGlow)"/>

  <text x="80" y="86" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="15" letter-spacing="3" fill="#F2A93B" font-weight="700">SMARTGEN DIGITAL MARKETING COURSE</text>

  <rect x="80" y="106" width="128" height="30" rx="15" fill="none" stroke="#F2A93B" stroke-width="1.5"/>
  <text x="98" y="126" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2" fill="#F6F1E4" font-weight="700">MODULE 19</text>

  <text x="78" y="255" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="700" fill="#F6F1E4">Google Ads</text>
  <text x="78" y="345" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="700" fill="#F6F1E4">Playbook</text>

  <text x="80" y="398" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="20.5" fill="#93A0C2">Ad copy, bidding, extensions, and tracking that actually converts</text>

  <rect x="80" y="426" width="480" height="2" fill="#2E3B5E"/>

  <text x="80" y="560" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="14" letter-spacing="2" fill="#4ED9AE" font-weight="700">AD COPY &#183; BIDDING &#183; EXTENSIONS &#183; TRACKING</text>

  <!-- Ad badge -->
  <g transform="translate(970,150)">
    <rect x="-22" y="-15" width="44" height="26" rx="4" fill="none" stroke="#4ED9AE" stroke-width="2"/>
    <text x="0" y="4" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#4ED9AE">Ad</text>
  </g>

  <!-- ascending bid path -->
  <path d="M900,470 L940,430 L975,455 L1015,390 L1050,415 L1090,340" fill="none" stroke="#F2A93B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>

  <!-- coin icon at start -->
  <g transform="translate(900,500)" stroke="#F6F1E4" stroke-width="2.2" fill="none">
    <circle r="16"/>
    <text x="0" y="5" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#F6F1E4" stroke="none">$</text>
  </g>

  <circle cx="940" cy="430" r="6" fill="#4ED9AE" filter="url(#dotGlow)"/>
  <circle cx="1015" cy="390" r="6" fill="#F1633C" filter="url(#dotGlow)"/>
  <circle cx="1050" cy="415" r="6" fill="#4ED9AE" filter="url(#dotGlow)"/>

  <!-- target icon at end (conversion) -->
  <g transform="translate(1090,340)" stroke="#F6F1E4" stroke-width="2.2" fill="none">
    <circle r="17"/><circle r="10"/><circle r="3" fill="#F6F1E4" stroke="none"/>
  </g>
</svg>
