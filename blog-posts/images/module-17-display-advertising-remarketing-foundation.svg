<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Display Advertising Remarketing Funnel</title><desc id="d">A funnel shows display reach, engaged visitors, remarketing audiences, and conversion.</desc><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#e7f4ff"/></linearGradient></defs><rect width="1600" height="900" fill="url(#b)"/><text x="80" y="95" font-family="Arial" font-size="42" font-weight="800" fill="#16356c">Display Advertising → Remarketing Funnel</text><text x="82" y="140" font-family="Arial" font-size="23" fill="#58719a">Turn broad reach into qualified return visits and measurable conversions</text><path d="M180 240 H1420 L1240 390 H360z" fill="#8bb9f0"/><path d="M360 410 H1240 L1110 540 H490z" fill="#4e83d9"/><path d="M490 560 H1110 L1010 675 H590z" fill="#19a7a1"/><path d="M590 695 H1010 L880 800 H720z" fill="#ed9f35"/><text x="650" y="310" font-family="Arial" font-size="30" font-weight="700" fill="#12305e">1. DISPLAY REACH</text><text x="625" y="360" font-family="Arial" font-size="18" fill="#12305e">target audiences across relevant inventory</text><text x="650" y="480" font-family="Arial" font-size="30" font-weight="700" fill="#fff">2. ENGAGED VISITORS</text><text x="650" y="525" font-family="Arial" font-size="18" fill="#eaf3ff">landing pages, content, and first-party signals</text><text x="645" y="625" font-family="Arial" font-size="30" font-weight="700" fill="#fff">3. REMARKETING AUDIENCE</text><text x="645" y="665" font-family="Arial" font-size="18" fill="#eafffb">return with relevant creative and controlled frequency</text><text x="690" y="755" font-family="Arial" font-size="28" font-weight="700" fill="#5b3810">4. CONVERSION</text><text x="625" y="838" font-family="Arial" font-size="18" fill="#6e4b1a">measure CPA, ROAS, and incremental value</text></svg>
