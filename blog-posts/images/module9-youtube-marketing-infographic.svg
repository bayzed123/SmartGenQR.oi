<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">YouTube Marketing Framework</title>
  <desc id="desc">A four-stage YouTube marketing framework from audience research through publishing and analytics.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffafa"/><stop offset="1" stop-color="#ffe8ed"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#8a1d30" flood-opacity=".16"/></filter></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><text x="80" y="92" font-family="Inter,Arial" font-size="42" font-weight="800" fill="#701827">YouTube Marketing Framework</text><text x="82" y="140" font-family="Inter,Arial" font-size="23" fill="#985665">A repeatable system for discoverability, retention, and channel growth</text>
  <g stroke="#d92d45" stroke-width="5" fill="none"><path d="M410 450 H530"/><path d="M780 450 H900"/><path d="M1150 450 H1270"/></g><g fill="#d92d45"><path d="M530 450 l-22-15 v30z"/><path d="M900 450 l-22-15 v30z"/><path d="M1270 450 l-22-15 v30z"/></g>
  <g filter="url(#shadow)"><rect x="80" y="260" width="330" height="380" rx="24" fill="#fff"/><rect x="450" y="260" width="330" height="380" rx="24" fill="#fff"/><rect x="820" y="260" width="330" height="380" rx="24" fill="#fff"/><rect x="1190" y="260" width="330" height="380" rx="24" fill="#fff"/></g>
  <circle cx="245" cy="350" r="58" fill="#d92d45"/><path d="M220 350 h50 M245 325 v50" stroke="#fff" stroke-width="10" stroke-linecap="round"/><text x="145" y="455" font-family="Inter,Arial" font-size="27" font-weight="800" fill="#701827">1. Research</text><text x="125" y="500" font-family="Inter,Arial" font-size="18" fill="#985665">Audience needs</text><text x="125" y="530" font-family="Inter,Arial" font-size="18" fill="#985665">search questions</text><text x="125" y="560" font-family="Inter,Arial" font-size="18" fill="#985665">channel promise</text>
  <circle cx="615" cy="350" r="58" fill="#ed9c33"/><path d="M590 350 l18 18 34-40" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><text x="515" y="455" font-family="Inter,Arial" font-size="27" font-weight="800" fill="#701827">2. Create</text><text x="495" y="500" font-family="Inter,Arial" font-size="18" fill="#985665">useful videos</text><text x="495" y="530" font-family="Inter,Arial" font-size="18" fill="#985665">strong hooks</text><text x="495" y="560" font-family="Inter,Arial" font-size="18" fill="#985665">clear structure</text>
  <circle cx="985" cy="350" r="58" fill="#5b57c9"/><path d="M956 350 h58 M985 321 v58" stroke="#fff" stroke-width="9" stroke-linecap="round"/><text x="865" y="455" font-family="Inter,Arial" font-size="27" font-weight="800" fill="#701827">3. Optimize</text><text x="865" y="500" font-family="Inter,Arial" font-size="18" fill="#985665">title and thumbnail</text><text x="865" y="530" font-family="Inter,Arial" font-size="18" fill="#985665">description and chapters</text><text x="865" y="560" font-family="Inter,Arial" font-size="18" fill="#985665">captions and links</text>
  <circle cx="1355" cy="350" r="58" fill="#19a7a1"/><path d="M1327 370 l18-36 17 20 24-37" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text x="1260" y="455" font-family="Inter,Arial" font-size="27" font-weight="800" fill="#701827">4. Learn</text><text x="1245" y="500" font-family="Inter,Arial" font-size="18" fill="#985665">CTR and reach</text><text x="1245" y="530" font-family="Inter,Arial" font-size="18" fill="#985665">watch time</text><text x="1245" y="560" font-family="Inter,Arial" font-size="18" fill="#985665">retention and return</text>
  <path d="M150 740 H1450" stroke="#e2b6be" stroke-width="4"/><text x="480" y="805" font-family="Inter,Arial" font-size="28" font-weight="800" fill="#d92d45">PUBLISH → MEASURE → IMPROVE → REPEAT</text>
</svg>
