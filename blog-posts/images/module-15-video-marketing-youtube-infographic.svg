<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Video Marketing Through YouTube Framework</title><desc id="d">A five-stage workflow moves from channel optimization to content, on-page SEO, off-page authority, and analytics.</desc><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff8f8"/><stop offset="1" stop-color="#ffe9ee"/></linearGradient></defs><rect width="1600" height="900" fill="url(#b)"/><text x="80" y="92" font-family="Arial" font-size="42" font-weight="800" fill="#7b1628">YouTube Video Marketing Framework</text><text x="82" y="140" font-family="Arial" font-size="23" fill="#995866">Build the channel, make the video, optimize the discovery path, and earn authority</text><g fill="#fff" stroke="#e8b6bf" stroke-width="2"><rect x="65" y="250" width="280" height="360" rx="22"/><rect x="365" y="250" width="280" height="360" rx="22"/><rect x="665" y="250" width="280" height="360" rx="22"/><rect x="965" y="250" width="280" height="360" rx="22"/><rect x="1265" y="250" width="280" height="360" rx="22"/></g><g stroke="#d92d45" stroke-width="4"><path d="M345 430 H365"/><path d="M645 430 H665"/><path d="M945 430 H965"/><path d="M1245 430 H1265"/></g><g font-family="Arial" fill="#7b1628" text-anchor="middle"><circle cx="205" cy="340" r="52" fill="#d92d45"/><text x="205" y="357" font-size="42" font-weight="800" fill="#fff">1</text><text x="205" y="450" font-size="24" font-weight="800">CHANNEL</text><text x="205" y="487" font-size="17" fill="#995866">positioning</text><text x="205" y="515" font-size="17" fill="#995866">branding</text><text x="205" y="543" font-size="17" fill="#995866">home page</text><circle cx="505" cy="340" r="52" fill="#ed9f35"/><text x="505" y="357" font-size="42" font-weight="800" fill="#fff">2</text><text x="505" y="450" font-size="24" font-weight="800">CONTENT</text><text x="505" y="487" font-size="17" fill="#995866">research</text><text x="505" y="515" font-size="17" fill="#995866">hook</text><text x="505" y="543" font-size="17" fill="#995866">retention</text><circle cx="805" cy="340" r="52" fill="#19a7a1"/><text x="805" y="357" font-size="42" font-weight="800" fill="#fff">3</text><text x="805" y="450" font-size="24" font-weight="800">ON-PAGE SEO</text><text x="805" y="487" font-size="17" fill="#995866">title</text><text x="805" y="515" font-size="17" fill="#995866">description</text><text x="805" y="543" font-size="17" fill="#995866">thumbnail</text><circle cx="1105" cy="340" r="52" fill="#5a58c9"/><text x="1105" y="357" font-size="42" font-weight="800" fill="#fff">4</text><text x="1105" y="450" font-size="24" font-weight="800">OFF-PAGE SEO</text><text x="1105" y="487" font-size="17" fill="#995866">shares</text><text x="1105" y="515" font-size="17" fill="#995866">embeds</text><text x="1105" y="543" font-size="17" fill="#995866">links</text><circle cx="1405" cy="340" r="52" fill="#2467c8"/><text x="1405" y="357" font-size="42" font-weight="800" fill="#fff">5</text><text x="1405" y="450" font-size="24" font-weight="800">ANALYTICS</text><text x="1405" y="487" font-size="17" fill="#995866">CTR</text><text x="1405" y="515" font-size="17" fill="#995866">watch time</text><text x="1405" y="543" font-size="17" fill="#995866">retention</text></g><text x="480" y="760" font-family="Arial" font-size="28" font-weight="800" fill="#d92d45">PLAN → PUBLISH → OPTIMIZE → EARN ATTENTION</text></svg>
