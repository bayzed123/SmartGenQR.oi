<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Yoast XML sitemap index</title>
  <desc id="desc">A Yoast SEO XML sitemap index showing post, page, category, and tag sitemaps with last-modified dates.</desc>
  <rect width="1200" height="630" fill="#f7fafc"/>
  <rect x="82" y="62" width="1036" height="506" rx="24" fill="#ffffff" stroke="#d8e1e9" stroke-width="3"/>
  <text x="130" y="128" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="800" fill="#3e4a56">XML Sitemap Index</text>
  <text x="130" y="174" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#5f6f7d">Generated by <tspan fill="#d34a2f" font-weight="700">Yoast SEO</tspan> for search-engine discovery</text>
  <rect x="130" y="218" width="940" height="48" rx="10" fill="#edf2f5"/>
  <text x="160" y="251" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#465563">SITEMAP</text>
  <text x="875" y="251" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#465563">LAST MODIFIED</text>
  <g font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#34495a">
    <rect x="130" y="280" width="940" height="46" fill="#f8fafb"/><text x="160" y="311">post-sitemap.xml</text><text x="875" y="311">2026-07-22</text>
    <rect x="130" y="326" width="940" height="46" fill="#ffffff"/><text x="160" y="357">page-sitemap.xml</text><text x="875" y="357">2026-07-20</text>
    <rect x="130" y="372" width="940" height="46" fill="#f8fafb"/><text x="160" y="403">category-sitemap.xml</text><text x="875" y="403">2026-07-18</text>
    <rect x="130" y="418" width="940" height="46" fill="#ffffff"/><text x="160" y="449">post_tag-sitemap.xml</text><text x="875" y="449">2026-07-15</text>
    <rect x="130" y="464" width="940" height="46" fill="#f8fafb"/><text x="160" y="495">topic-sitemap.xml</text><text x="875" y="495">2026-07-12</text>
  </g>
  <text x="130" y="545" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#5f6f7d">Index file → organized sitemap files → faster crawling</text>
</svg>
