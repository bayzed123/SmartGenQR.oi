  <text x="590" y="794" text-anchor="middle" fill="#C4B5FD" font-size="8.5" font-weight="700">DESIGN SYSTEMS</text>
  <text x="590" y="806" text-anchor="middle" fill="#8B7AAE" font-size="7.5">+ Applied Design</text>
