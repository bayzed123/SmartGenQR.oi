<svg viewBox="0 0 800 868" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">

  <defs>
    <filter id="card-shadow" x="-4%" y="-4%" width="112%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="rgba(76,29,149,0.10)"/>
    </filter>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5B21B6;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#3B1878;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="stats-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B1878;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2A1155;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- BACKGROUND -->
  <rect width="800" height="868" fill="#FAF8FF"/>

  <!-- ================================================ -->
  <!-- HEADER                                           -->
  <!-- ================================================ -->
  <rect width="800" height="118" fill="url(#header-grad)"/>
  <circle cx="748" cy="20" r="90" fill="rgba(255,255,255,0.05)"/>
  <circle cx="762" cy="112" r="55" fill="rgba(255,255,255,0.05)"/>
  <circle cx="28" cy="92" r="64" fill="rgba(255,255,255,0.05)"/>

  <!-- Icon: persona silhouette -->
  <rect x="20" y="20" width="68" height="68" rx="10" fill="rgba(255,255,255,0.16)"/>
  <circle cx="54" cy="46" r="11" fill="white" opacity="0.9"/>
  <path d="M 34 74 Q 54 54 74 74" fill="white" opacity="0.9"/>

  <!-- Header Titles -->
  <text x="106" y="44" fill="white" font-size="21" font-weight="700" letter-spacing="-0.3">The UX Design Process</text>
  <text x="106" y="70" fill="rgba(255,255,255,0.88)" font-size="13">Class 03 — App Design &amp; UX Process, Research &amp; Personas</text>
  <text x="106" y="96" fill="rgba(255,255,255,0.62)" font-size="11">SmartGen UI/UX Design Course  ·  smartgentools.com  ·  By Sayad Md Bayezid Hosan</text>

  <!-- ================================================ -->
  <!-- STATS STRIP                                      -->
  <!-- ================================================ -->
  <rect y="118" width="800" height="56" fill="url(#stats-grad)"/>

  <text x="133" y="143" text-anchor="middle" fill="white" font-size="17" font-weight="700">7 Stages</text>
  <text x="133" y="162" text-anchor="middle" fill="rgba(255,255,255,0.80)" font-size="10.5">Discovery to Launch</text>

  <line x1="266" y1="127" x2="266" y2="168" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>

  <text x="400" y="143" text-anchor="middle" fill="white" font-size="17" font-weight="700">5 → ~85%</text>
  <text x="400" y="162" text-anchor="middle" fill="rgba(255,255,255,0.80)" font-size="10.5">Users Needed to Find Most Issues</text>

  <line x1="533" y1="127" x2="533" y2="168" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>

  <text x="667" y="143" text-anchor="middle" fill="white" font-size="17" font-weight="700">3–5</text>
  <text x="667" y="162" text-anchor="middle" fill="rgba(255,255,255,0.80)" font-size="10.5">Personas Per Typical Project</text>

  <!-- ================================================ -->
  <!-- SECTION LABEL                                    -->
  <!-- ================================================ -->
  <text x="400" y="194" text-anchor="middle" fill="#7C5CBF" font-size="9.5" letter-spacing="2.5" font-weight="700">FROM PROCESS TO RESEARCH TO PERSONA</text>

  <!-- ================================================ -->
  <!-- CARD 1: App Design & The UX Process (full width) -->
  <!-- ================================================ -->
  <rect x="20" y="204" width="760" height="140" rx="11" fill="white" filter="url(#card-shadow)"/>
  <rect x="20" y="204" width="5" height="140" rx="2.5" fill="#4C1D95"/>

  <circle cx="63" cy="228" r="18" fill="#4C1D95"/>
  <text x="63" y="234" text-anchor="middle" fill="white" font-size="14" font-weight="700">1</text>
  <text x="89" y="224" fill="#1A1A1A" font-size="13.5" font-weight="700">App Design &amp; The UX Process</text>
  <text x="89" y="240" fill="#4C1D95" font-size="8.5" font-weight="700" letter-spacing="0.6">THE UMBRELLA THAT RESEARCH &amp; PERSONAS LIVE INSIDE</text>

  <line x1="32" y1="252" x2="768" y2="252" stroke="#EDE4FB" stroke-width="1"/>

  <circle cx="46" cy="267" r="3.5" fill="#4C1D95"/>
  <text x="56" y="271" fill="#333" font-size="10" font-weight="600">Discovery → Research → Define</text>

  <circle cx="306" cy="267" r="3.5" fill="#4C1D95"/>
  <text x="316" y="271" fill="#333" font-size="10" font-weight="600">Ideate → Design → Prototype</text>

  <circle cx="566" cy="267" r="3.5" fill="#4C1D95"/>
  <text x="576" y="271" fill="#333" font-size="10" font-weight="600">Test → Launch → Iterate</text>

  <rect x="32" y="288" width="736" height="26" rx="6" fill="#F1EBFB"/>
  <text x="400" y="305" text-anchor="middle" fill="#4C1D95" font-size="9.5" font-weight="700">Mirrors Design Thinking: Empathize → Define → Ideate → Prototype → Test</text>

  <!-- ================================================ -->
  <!-- CARD 2: User Research                            -->
  <!-- ================================================ -->
  <rect x="20" y="358" width="372" height="180" rx="11" fill="white" filter="url(#card-shadow)"/>
  <rect x="20" y="358" width="5" height="180" rx="2.5" fill="#7C3AED"/>
  <circle cx="63" cy="384" r="18" fill="#7C3AED"/>
  <text x="63" y="390" text-anchor="middle" fill="white" font-size="14" font-weight="700">2</text>
  <text x="89" y="380" fill="#1A1A1A" font-size="13.5" font-weight="700">User Research</text>
  <text x="89" y="396" fill="#7C3AED" font-size="8.5" font-weight="700" letter-spacing="0.6">FIND OUT IF YOUR ASSUMPTIONS ARE TRUE</text>
  <line x1="32" y1="410" x2="381" y2="410" stroke="#EDE4FB" stroke-width="1"/>

  <circle cx="40" cy="427" r="3.5" fill="#7C3AED"/>
  <text x="50" y="431" fill="#333" font-size="10.5" font-weight="600">Qualitative = why/how · Quantitative = how many</text>
  <circle cx="40" cy="447" r="3.5" fill="#7C3AED"/>
  <text x="50" y="451" fill="#333" font-size="10.5" font-weight="600">Interviews, surveys, usability tests, comp. analysis</text>
  <circle cx="40" cy="467" r="3.5" fill="#7C3AED"/>
  <text x="50" y="471" fill="#333" font-size="10.5" font-weight="600">Research before design, not after it's built</text>

  <rect x="32" y="488" width="348" height="28" rx="7" fill="#F5F0FE"/>
  <text x="206" y="506" text-anchor="middle" fill="#7C3AED" font-size="10" font-weight="700">5 users can surface ~85% of usability issues</text>

  <!-- ================================================ -->
  <!-- CARD 3: User Persona                             -->
  <!-- ================================================ -->
  <rect x="408" y="358" width="372" height="180" rx="11" fill="white" filter="url(#card-shadow)"/>
  <rect x="408" y="358" width="5" height="180" rx="2.5" fill="#A855F7"/>
  <circle cx="451" cy="384" r="18" fill="#A855F7"/>
  <text x="451" y="390" text-anchor="middle" fill="white" font-size="14" font-weight="700">3</text>
  <text x="477" y="380" fill="#1A1A1A" font-size="13.5" font-weight="700">User Persona</text>
  <text x="477" y="396" fill="#A855F7" font-size="8.5" font-weight="700" letter-spacing="0.6">TURNING RESEARCH INTO A DESIGN TOOL</text>
  <line x1="420" y1="410" x2="769" y2="410" stroke="#F3E8FE" stroke-width="1"/>

  <circle cx="428" cy="427" r="3.5" fill="#A855F7"/>
  <text x="438" y="431" fill="#333" font-size="10.5" font-weight="600">A research-grounded synthesis — not a guess</text>
  <circle cx="428" cy="447" r="3.5" fill="#A855F7"/>
  <text x="438" y="451" fill="#333" font-size="10.5" font-weight="600">Name, quote, goals, frustrations, behaviors</text>
  <circle cx="428" cy="467" r="3.5" fill="#A855F7"/>
  <text x="438" y="471" fill="#333" font-size="10.5" font-weight="600">Most teams use 3–5 personas, not 1 or 15</text>

  <rect x="420" y="488" width="348" height="28" rx="7" fill="#FAF0FE"/>
  <text x="594" y="506" text-anchor="middle" fill="#A855F7" font-size="10" font-weight="700">Assumption personas ≠ research-based personas</text>

  <!-- ================================================ -->
  <!-- 7-STAGE PROCESS TIMELINE PANEL                   -->
  <!-- ================================================ -->
  <rect x="20" y="552" width="760" height="190" rx="11" fill="white" filter="url(#card-shadow)"/>
  <rect x="20" y="552" width="760" height="32" rx="11" fill="#5B21B6"/>
  <rect x="20" y="568" width="760" height="16" fill="#5B21B6"/>
  <text x="400" y="573" text-anchor="middle" fill="white" font-size="12" font-weight="700" letter-spacing="0.4">THE UX DESIGN PROCESS — 7 STAGES</text>

  <!-- Connecting line -->
  <line x1="74" y1="656" x2="726" y2="656" stroke="#EDE4FB" stroke-width="3"/>

  <!-- Node 1: Discovery -->
  <circle cx="74" cy="656" r="13" fill="#EDE4FB"/>
  <text x="74" y="660" text-anchor="middle" fill="#7C3AED" font-size="10" font-weight="700">1</text>
  <text x="74" y="690" text-anchor="middle" fill="#6B7280" font-size="9.5" font-weight="600">Discovery</text>

  <!-- Node 2: Research (highlighted) -->
  <circle cx="183" cy="656" r="16" fill="#7C3AED"/>
  <text x="183" y="661" text-anchor="middle" fill="white" font-size="11" font-weight="700">2</text>
  <text x="183" y="692" text-anchor="middle" fill="#4C1D95" font-size="10" font-weight="700">Research</text>

  <!-- Node 3: Define (highlighted) -->
  <circle cx="291" cy="656" r="16" fill="#7C3AED"/>
  <text x="291" y="661" text-anchor="middle" fill="white" font-size="11" font-weight="700">3</text>
  <text x="291" y="692" text-anchor="middle" fill="#4C1D95" font-size="10" font-weight="700">Define</text>

  <!-- Node 4: Ideate -->
  <circle cx="400" cy="656" r="13" fill="#EDE4FB"/>
  <text x="400" y="660" text-anchor="middle" fill="#7C3AED" font-size="10" font-weight="700">4</text>
  <text x="400" y="690" text-anchor="middle" fill="#6B7280" font-size="9.5" font-weight="600">Ideate</text>

  <!-- Node 5: Design -->
  <circle cx="509" cy="656" r="13" fill="#EDE4FB"/>
  <text x="509" y="660" text-anchor="middle" fill="#7C3AED" font-size="10" font-weight="700">5</text>
  <text x="509" y="690" text-anchor="middle" fill="#6B7280" font-size="9.5" font-weight="600">Design</text>

  <!-- Node 6: Test -->
  <circle cx="617" cy="656" r="13" fill="#EDE4FB"/>
  <text x="617" y="660" text-anchor="middle" fill="#7C3AED" font-size="10" font-weight="700">6</text>
  <text x="617" y="690" text-anchor="middle" fill="#6B7280" font-size="9.5" font-weight="600">Prototype &amp; Test</text>

  <!-- Node 7: Launch -->
  <circle cx="726" cy="656" r="13" fill="#EDE4FB"/>
  <text x="726" y="660" text-anchor="middle" fill="#7C3AED" font-size="10" font-weight="700">7</text>
  <text x="726" y="690" text-anchor="middle" fill="#6B7280" font-size="9.5" font-weight="600">Launch</text>

  <rect x="140" y="708" width="300" height="22" rx="11" fill="#F1EBFB"/>
  <text x="290" y="723" text-anchor="middle" fill="#4C1D95" font-size="9" font-weight="700">Research &amp; Define — today's focus</text>

  <!-- ================================================ -->
  <!-- FOOTER: UI/UX Course Roadmap Loop                -->
  <!-- ================================================ -->
  <rect y="756" width="800" height="80" fill="#2A1155"/>

  <text x="400" y="774" text-anchor="middle" fill="white" font-size="11" font-weight="700" letter-spacing="1.3">THE SMARTGEN UI/UX DESIGN COURSE ROADMAP</text>

