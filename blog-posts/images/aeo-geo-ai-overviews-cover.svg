<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#221C4A"/>
      <stop offset="55%" stop-color="#181433"/>
      <stop offset="100%" stop-color="#0F0C22"/>
    </linearGradient>
    <pattern id="dots3" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>
    <radialGradient id="cardGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F0C22"/>
      <stop offset="100%" stop-color="#201A44"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad3)"/>
  <rect width="1200" height="630" fill="url(#dots3)"/>

  <!-- Eyebrow -->
  <text x="80" y="112" font-family="'JetBrains Mono','Courier New',monospace" font-size="15" letter-spacing="3" fill="#22D3EE" font-weight="700">SMARTGEN SEO COURSE · AI SEARCH GUIDE</text>

  <!-- Title -->
  <text x="78" y="182" font-family="'Sora','Poppins',sans-serif" font-size="45" font-weight="700" fill="#FFFFFF">AEO, GEO &amp; AI Overviews:</text>
  <text x="78" y="240" font-family="'Sora','Poppins',sans-serif" font-size="45" font-weight="700" fill="#FFFFFF">The Real 2026 Guide</text>

  <!-- Subtitle -->
  <text x="80" y="286" font-family="'Inter',Helvetica,Arial,sans-serif" font-size="18" fill="#B4B8E0">What Google's own guidance actually says — not hype</text>

  <!-- Author / course tag -->
  <text x="80" y="326" font-family="'Inter',Helvetica,Arial,sans-serif" font-size="15" fill="#8B8FBF">A SmartGen SEO Guide · By Sayad Md Bayezid Hosan</text>

  <!-- Badge row -->
  <g font-family="'Inter',Helvetica,Arial,sans-serif" font-size="13" font-weight="600">
    <rect x="80" y="358" width="118" height="30" rx="15" fill="none" stroke="#42407A" stroke-width="1.5"/>
    <text x="99" y="377" fill="#C9CCEE">AI Overviews</text>

    <rect x="210" y="358" width="104" height="30" rx="15" fill="none" stroke="#42407A" stroke-width="1.5"/>
    <text x="229" y="377" fill="#C9CCEE">AEO vs GEO</text>

    <rect x="326" y="358" width="146" height="30" rx="15" fill="none" stroke="#42407A" stroke-width="1.5"/>
    <text x="345" y="377" fill="#C9CCEE">Google-Verified</text>
  </g>

  <!-- ===== Right side: AI Overview mock card ===== -->
  <g transform="translate(770,45)">
    <circle cx="190" cy="150" r="220" fill="url(#cardGlow)"/>

    <rect x="0" y="0" width="380" height="230" rx="16" fill="#1E1B3D" stroke="#3A3568" stroke-width="1.5"/>

    <!-- sparkle icon -->
    <path d="M24,14 L28,22 L36,26 L28,30 L24,38 L20,30 L12,26 L20,22 Z" fill="#FFC93C"/>
    <text x="42" y="31" font-family="'Sora',sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">AI Overview</text>

    <line x1="20" y1="50" x2="360" y2="50" stroke="#33305E" stroke-width="1"/>

    <text x="20" y="76" font-family="'Inter',sans-serif" font-size="14" fill="#C9CCEE">Search is shifting from ten blue links</text>
    <text x="20" y="98" font-family="'Inter',sans-serif" font-size="14" fill="#C9CCEE">to synthesized answers with citations,</text>
    <text x="20" y="120" font-family="'Inter',sans-serif" font-size="14" fill="#C9CCEE">grounded in real indexed web pages.</text>

    <!-- citation chips -->
    <rect x="20" y="140" width="30" height="26" rx="6" fill="#2D2860" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="35" y="158" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" fill="#C9B8FF">1</text>
    <rect x="58" y="140" width="30" height="26" rx="6" fill="#2D2860" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="73" y="158" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" fill="#C9B8FF">2</text>
    <rect x="96" y="140" width="30" height="26" rx="6" fill="#2D2860" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="111" y="158" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" fill="#C9B8FF">3</text>
    <text x="136" y="158" font-family="'Inter',sans-serif" font-size="12" fill="#8B8FBF">sources retrieved via RAG</text>

    <line x1="20" y1="184" x2="360" y2="184" stroke="#33305E" stroke-width="1"/>
    <text x="20" y="206" font-family="'Inter',sans-serif" font-size="13" font-style="italic" fill="#9AA0C8">Traditional SEO fundamentals still apply.</text>

    <!-- verified badge -->
    <rect x="0" y="250" width="380" height="40" rx="20" fill="#2E260F" stroke="#FFC93C" stroke-width="1.5"/>
    <path d="M22,262 L26,266 L34,256" stroke="#FFC93C" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="46" y="275" font-family="'Inter',sans-serif" font-size="13" font-weight="700" fill="#FFC93C">Cross-checked against Google's official AI search guide</text>
  </g>

  <!-- ===== Bottom: Search Console breadcrumb bar ===== -->
  <g transform="translate(80,500)">
    <rect x="0" y="0" width="1040" height="68" rx="14" fill="url(#barGrad3)" stroke="#302C5E" stroke-width="1.5"/>
    <circle cx="28" cy="22" r="5" fill="#8B5CF6"/>
    <circle cx="48" cy="22" r="5" fill="#22D3EE"/>
    <circle cx="68" cy="22" r="5" fill="#FFC93C"/>
    <text x="28" y="50" font-family="'JetBrains Mono','Courier New',monospace" font-size="16">
      <tspan fill="#C9CCEE">Search Console</tspan><tspan fill="#7B82AC">  →  </tspan><tspan fill="#22D3EE" font-weight="700">Generative AI performance report</tspan>
    </text>
