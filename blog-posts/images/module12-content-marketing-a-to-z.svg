  <line x1="530" y1="290" x2="530" y2="382" stroke="#3A4A72" stroke-width="2"/>
  <circle cx="530" cy="260" r="34" fill="#1B2540" stroke="#F1633C" stroke-width="3"/>
  <text x="530" y="271" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#F6F1E4">C</text>
  <!-- blueprint icon -->
  <g transform="translate(530,212)" stroke="#F1633C" stroke-width="2" fill="none">
    <rect x="-10" y="-8" width="20" height="16" rx="2"/>
    <line x1="-6" y1="-3" x2="6" y2="-3"/>
    <line x1="-6" y1="3" x2="2" y2="3"/>
  </g>
  <text x="530" y="140" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#F6F1E4">FORMULA</text>
  <text x="530" y="160" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="12" fill="#93A0C2">Proven content structures</text>
  <text x="530" y="175" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="12" fill="#93A0C2">that make ideas land</text>

  <!-- ===================== STOP D (below) ===================== -->
  <line x1="720" y1="440" x2="720" y2="530" stroke="#3A4A72" stroke-width="2"/>
  <circle cx="720" cy="560" r="34" fill="#1B2540" stroke="#4ED9AE" stroke-width="3"/>
  <text x="720" y="571" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#F6F1E4">D</text>
  <!-- pen icon -->
  <g transform="translate(720,618)">
