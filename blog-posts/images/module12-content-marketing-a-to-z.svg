  <text x="720" y="656" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#F6F1E4">WRITING</text>
  <text x="720" y="674" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="12" fill="#93A0C2">Optimized &amp; genuinely engaging</text>

  <!-- ===================== STOP E (above) ===================== -->
  <line x1="910" y1="300" x2="910" y2="392" stroke="#3A4A72" stroke-width="2"/>
  <circle cx="910" cy="270" r="34" fill="#1B2540" stroke="#F1633C" stroke-width="3"/>
  <text x="910" y="281" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#F6F1E4">E</text>
  <!-- basket icon -->
  <g transform="translate(910,222)" stroke="#F1633C" stroke-width="2" fill="none">
    <path d="M-11,-4 L-8,8 L8,8 L11,-4 Z"/>
    <path d="M-6,-4 C-6,-11 6,-11 6,-4"/>
  </g>
  <text x="910" y="150" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#F6F1E4">BUCKETING</text>
  <text x="910" y="170" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="12" fill="#93A0C2">Organizing your content</text>
  <text x="910" y="185" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="12" fill="#93A0C2">library so nothing drifts</text>

  <!-- ===================== STOP Z (below, finish) ===================== -->
  <line x1="1080" y1="450" x2="1080" y2="540" stroke="#3A4A72" stroke-width="2"/>
  <circle cx="1080" cy="570" r="36" fill="#1B2540" stroke="#F2A93B" stroke-width="3.5"/>
  <text x="1080" y="582" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#F6F1E4">Z</text>
  <!-- chart icon -->
  <g transform="translate(1080,628)" fill="#F2A93B">
    <rect x="-14" y="-2" width="6" height="14"/>
    <rect x="-4" y="-10" width="6" height="22"/>
    <rect x="6" y="-16" width="6" height="28"/>
  </g>
  <text x="1080" y="666" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#F6F1E4">MEASUREMENT</text>
  <text x="1080" y="684" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="12" fill="#93A0C2">Proving what's really working</text>

</svg>
