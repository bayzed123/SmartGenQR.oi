<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101728"/>
      <stop offset="100%" stop-color="#1C2C4D"/>
    </linearGradient>
    <filter id="glow2" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="url(#bgGrad2)"/>

  <!-- title -->
  <text x="600" y="62" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="#F6F1E4">The A &#8594; Z Content Marketing Journey</text>
  <text x="600" y="94" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="17" fill="#93A0C2">Six stops from foundational strategy all the way to measurable results</text>

  <!-- road -->
  <path d="M60,420 C250,340 400,470 600,405 C800,340 960,470 1140,405" fill="none" stroke="#233256" stroke-width="34" stroke-linecap="round"/>
  <path d="M60,420 C250,340 400,470 600,405 C800,340 960,470 1140,405" fill="none" stroke="#F6F1E4" stroke-width="2" stroke-dasharray="14 14" opacity="0.35"/>

  <!-- start flag -->
  <g transform="translate(46,405)">
    <rect x="-2" y="-40" width="4" height="60" fill="#F6F1E4"/>
    <polygon points="2,-40 34,-32 2,-24" fill="#F2A93B"/>
  </g>
  <text x="46" y="452" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="12" letter-spacing="2" fill="#F2A93B" font-weight="700">START</text>

  <!-- finish checkered flag -->
  <g transform="translate(1150,405)">
    <rect x="-2" y="-40" width="4" height="60" fill="#F6F1E4"/>
    <rect x="2" y="-40" width="14" height="7" fill="#F6F1E4"/>
    <rect x="16" y="-33" width="14" height="7" fill="#101728"/>
    <rect x="2" y="-26" width="14" height="7" fill="#101728"/>
    <rect x="16" y="-40" width="14" height="7" fill="#101728"/>
    <rect x="2" y="-33" width="14" height="7" fill="#F6F1E4"/>
    <rect x="16" y="-26" width="14" height="7" fill="#F6F1E4"/>
  </g>
  <text x="1150" y="452" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="12" letter-spacing="2" fill="#F2A93B" font-weight="700">FINISH</text>

  <!-- ===================== STOP A (above) ===================== -->
  <line x1="150" y1="300" x2="150" y2="392" stroke="#3A4A72" stroke-width="2"/>
  <circle cx="150" cy="270" r="34" fill="#1B2540" stroke="#F2A93B" stroke-width="3"/>
  <text x="150" y="281" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#F6F1E4">A</text>
  <!-- lightbulb icon -->
  <g transform="translate(150,222)" stroke="#F2A93B" stroke-width="2" fill="none">
    <circle cx="0" cy="0" r="10"/>
