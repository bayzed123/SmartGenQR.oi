  <text x="150" y="150" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#F6F1E4">INTRODUCTION</text>
  <text x="150" y="170" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="12" fill="#93A0C2">What content marketing</text>
  <text x="150" y="185" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="12" fill="#93A0C2">actually is &amp; why it works</text>

  <!-- ===================== STOP B (below) ===================== -->
  <line x1="340" y1="450" x2="340" y2="540" stroke="#3A4A72" stroke-width="2"/>
