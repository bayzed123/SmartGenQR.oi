<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Website SEO and YouTube SEO Foundations</title><desc id="d">Three shared SEO pillars connect search intent, content quality, and authority across websites and YouTube.</desc><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fbff"/><stop offset="1" stop-color="#eaf3ff"/></linearGradient></defs><rect width="1600" height="900" fill="url(#b)"/><text x="80" y="92" font-family="Arial" font-size="42" font-weight="800" fill="#16356c">Website SEO ↔ YouTube SEO</text><text x="82" y="140" font-family="Arial" font-size="23" fill="#58719a">The same fundamentals, adapted to the way people search and watch</text><g fill="#fff" stroke="#cbdced" stroke-width="2"><rect x="120" y="220" width="390" height="500" rx="25"/><rect x="605" y="220" width="390" height="500" rx="25"/><rect x="1090" y="220" width="390" height="500" rx="25"/></g><circle cx="315" cy="330" r="58" fill="#2467c8"/><text x="286" y="345" font-family="Arial" font-size="44" font-weight="700" fill="#fff">1</text><text x="205" y="445" font-family="Arial" font-size="28" font-weight="800" fill="#16356c">DISCOVERABILITY</text><text x="180" y="500" font-family="Arial" font-size="19" fill="#58719a">keywords and intent</text><text x="180" y="535" font-family="Arial" font-size="19" fill="#58719a">titles and descriptions</text><text x="180" y="570" font-family="Arial" font-size="19" fill="#58719a">search-friendly structure</text><circle cx="800" cy="330" r="58" fill="#19a7a1"/><text x="771" y="345" font-family="Arial" font-size="44" font-weight="700" fill="#fff">2</text><text x="710" y="445" font-family="Arial" font-size="28" font-weight="800" fill="#16356c">CONTENT QUALITY</text><text x="665" y="500" font-family="Arial" font-size="19" fill="#58719a">useful page or video</text><text x="665" y="535" font-family="Arial" font-size="19" fill="#58719a">clear structure and hook</text><text x="665" y="570" font-family="Arial" font-size="19" fill="#58719a">satisfying the viewer</text><circle cx="1285" cy="330" r="58" fill="#ed9f35"/><text x="1256" y="345" font-family="Arial" font-size="44" font-weight="700" fill="#fff">3</text><text x="1205" y="445" font-family="Arial" font-size="28" font-weight="800" fill="#16356c">AUTHORITY</text><text x="1170" y="500" font-family="Arial" font-size="19" fill="#58719a">links and mentions</text><text x="1170" y="535" font-family="Arial" font-size="19" fill="#58719a">shares and embeds</text><text x="1170" y="570" font-family="Arial" font-size="19" fill="#58719a">trust over time</text><path d="M280 650 H1320" stroke="#c1d5e8" stroke-width="4"/><text x="470" y="795" font-family="Arial" font-size="28" font-weight="800" fill="#2467c8">INTENT → VALUE → TRUST → DISCOVERY</text></svg>
