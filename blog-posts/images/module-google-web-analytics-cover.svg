<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1526"/>
      <stop offset="100%" stop-color="#1B2A4A"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="dotGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- ambient blobs -->
  <circle cx="1010" cy="150" r="150" fill="#4ED9AE" opacity="0.10" filter="url(#softGlow)"/>
  <circle cx="1090" cy="510" r="170" fill="#F1633C" opacity="0.08" filter="url(#softGlow)"/>

  <!-- faint ghost magnifying glass (analysis motif) -->
  <g opacity="0.07" stroke="#F6F1E4" stroke-width="16" fill="none">
    <circle cx="960" cy="300" r="110"/>
    <line x1="1040" y1="380" x2="1130" y2="470"/>
  </g>

  <!-- faint background grid dots -->
  <g fill="#F6F1E4" opacity="0.08">
    <circle cx="780" cy="90" r="2.5"/><circle cx="820" cy="90" r="2.5"/><circle cx="860" cy="90" r="2.5"/>
    <circle cx="780" cy="130" r="2.5"/><circle cx="820" cy="130" r="2.5"/><circle cx="860" cy="130" r="2.5"/>
  </g>

  <!-- eyebrow -->
  <text x="80" y="86" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="15" letter-spacing="3" fill="#F2A93B" font-weight="700">SMARTGEN DIGITAL MARKETING COURSE</text>

  <!-- module pill -->
  <rect x="80" y="106" width="128" height="30" rx="15" fill="none" stroke="#F2A93B" stroke-width="1.5"/>
  <text x="98" y="126" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2" fill="#F6F1E4" font-weight="700">MODULE 17</text>

  <!-- headline -->
  <text x="78" y="255" font-family="Georgia, 'Times New Roman', serif" font-size="80" font-weight="700" fill="#F6F1E4">Google Web</text>
  <text x="78" y="345" font-family="Georgia, 'Times New Roman', serif" font-size="80" font-weight="700" fill="#F6F1E4">Analytics</text>

  <!-- subhead -->
  <text x="80" y="398" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="21" fill="#93A0C2">Turn raw visitor data into decisions you can actually act on</text>

  <!-- divider -->
  <rect x="80" y="426" width="480" height="2" fill="#2E3B5E"/>

  <!-- bottom tags -->
  <text x="80" y="560" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="14.5" letter-spacing="2" fill="#4ED9AE" font-weight="700">METRICS &#183; REPORTS &#183; SEGMENTS &#183; INSIGHTS</text>

  <!-- growth chart signature line -->
  <path d="M840,520 L890,470 L930,500 L980,410 L1020,440 L1070,350 L1110,380 L1145,300" fill="none" stroke="#F2A93B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>

  <!-- bar chart icon at path start -->
  <g transform="translate(806,552)" fill="#F6F1E4">
    <rect x="0" y="18" width="9" height="18"/>
    <rect x="13" y="6" width="9" height="30"/>
    <rect x="26" y="-8" width="9" height="44"/>
  </g>

  <!-- nodes along the path -->
  <circle cx="890" cy="470" r="6.5" fill="#4ED9AE" filter="url(#dotGlow)"/>
  <circle cx="980" cy="410" r="6.5" fill="#F1633C" filter="url(#dotGlow)"/>
  <circle cx="1020" cy="440" r="6.5" fill="#4ED9AE" filter="url(#dotGlow)"/>
  <circle cx="1070" cy="350" r="6.5" fill="#F2A93B" filter="url(#dotGlow)"/>

  <!-- magnifying glass at path end (analyzing the growth) -->
  <g transform="translate(1145,300)" stroke="#F6F1E4" stroke-width="3" fill="none">
    <circle cx="-6" cy="-6" r="15"/>
    <line x1="5" y1="5" x2="22" y2="22"/>
  </g>
</svg>