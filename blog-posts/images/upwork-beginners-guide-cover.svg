<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Upwork for beginners guide</title>
  <desc id="desc">A freelancer proposal card rising above a stack of generic proposals, with a rising earnings line behind it.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#18324a" flood-opacity=".14"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- rising earnings line -->
  <polyline points="90,470 250,430 400,440 560,340 720,300 880,210 1060,150"
            fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity=".35"/>
  <circle cx="1060" cy="150" r="11" fill="#2563eb" opacity=".55"/>

  <!-- stack of ignored generic proposals -->
  <g opacity=".55">
    <rect x="120" y="330" width="330" height="66" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="150" y="356" width="180" height="9" rx="4.5" fill="#cbd5e1"/>
    <rect x="150" y="372" width="120" height="9" rx="4.5" fill="#e2e8f0"/>

    <rect x="106" y="410" width="330" height="66" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="136" y="436" width="200" height="9" rx="4.5" fill="#cbd5e1"/>
    <rect x="136" y="452" width="96" height="9" rx="4.5" fill="#e2e8f0"/>

    <rect x="92" y="490" width="330" height="66" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="122" y="516" width="160" height="9" rx="4.5" fill="#cbd5e1"/>
    <rect x="122" y="532" width="140" height="9" rx="4.5" fill="#e2e8f0"/>
  </g>

  <!-- the winning proposal -->
  <g filter="url(#shadow)">
    <rect x="520" y="330" width="560" height="212" rx="20" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
    <rect x="520" y="330" width="560" height="8" rx="4" fill="url(#accent)"/>
    <circle cx="566" cy="386" r="20" fill="#2563eb"/>
    <path d="M558 386 l6 6 l12 -13" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="600" y="376" width="250" height="12" rx="6" fill="#1e293b"/>
    <rect x="600" y="398" width="150" height="10" rx="5" fill="#94a3b8"/>
    <rect x="556" y="436" width="488" height="9" rx="4.5" fill="#e2e8f0"/>
    <rect x="556" y="456" width="430" height="9" rx="4.5" fill="#e2e8f0"/>
    <rect x="556" y="476" width="300" height="9" rx="4.5" fill="#e2e8f0"/>
    <rect x="556" y="504" width="132" height="24" rx="12" fill="#dcfce7"/>
    <text x="622" y="521" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
          font-size="13" font-weight="700" fill="#15803d">HIRED</text>
  </g>

  <!-- heading -->
  <text x="92" y="150" font-family="Inter, system-ui, -apple-system, sans-serif"
        font-size="62" font-weight="800" fill="#0f172a">Upwork for Beginners</text>
  <text x="92" y="212" font-family="Inter, system-ui, -apple-system, sans-serif"
        font-size="32" font-weight="600" fill="#2563eb">Your first client in 2026</text>
  <text x="92" y="262" font-family="Inter, system-ui, -apple-system, sans-serif"
        font-size="22" font-weight="500" fill="#64748b">Profile &#183; Connects &#183; Proposals &#183; Pricing</text>

  <text x="1108" y="586" text-anchor="end" font-family="Inter, system-ui, sans-serif"
        font-size="20" font-weight="700" fill="#94a3b8">SmartGen Tools</text>
</svg>
