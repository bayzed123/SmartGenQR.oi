<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1B2A4A" stroke-width="1"/>
    </pattern>
    <linearGradient id="scanGlow2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2DD4BF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="#0B1220"/>
  <rect width="1200" height="700" fill="url(#grid2)" opacity="0.5"/>

  <!-- Corner brackets -->
  <g stroke="#2DD4BF" stroke-width="2.5" fill="none" stroke-linecap="square">
    <path d="M 40 72 L 40 40 L 72 40"/>
    <path d="M 1128 40 L 1160 40 L 1160 72"/>
    <path d="M 1160 628 L 1160 660 L 1128 660"/>
    <path d="M 72 660 L 40 660 L 40 628"/>
  </g>

  <!-- Eyebrow + heading -->
  <text x="600" y="88" text-anchor="middle" font-family="'Consolas','SF Mono',monospace" font-size="14" letter-spacing="4" fill="#F5A623" font-weight="700">MODULE 14 &#183; THE CORE PRINCIPLE</text>
  <rect x="40" y="104" width="1120" height="2" fill="url(#scanGlow2)"/>
  <text x="600" y="150" text-anchor="middle" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="38" font-weight="900" fill="#F1F5F9">Why Technical SEO Comes First</text>

  <!-- Pyramid: top layer = Off-Page (Module 11) -->
  <polygon points="600,205 488,315 712,315" fill="#131F3A" stroke="#3A4A6B" stroke-width="1.5"/>
  <text x="600" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#B9C4DA">OFF-PAGE SEO</text>
  <text x="600" y="298" text-anchor="middle" font-family="'Consolas',monospace" font-size="12" letter-spacing="1" fill="#7C8DAF">MODULE 11 &#183; LINKS &amp; AUTHORITY</text>

  <!-- Middle layer = On-Page -->
  <polygon points="488,315 712,315 822,430 378,430" fill="#122A3C" stroke="#2DD4BF" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="600" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#D7E4F0">ON-PAGE SEO</text>
  <text x="600" y="403" text-anchor="middle" font-family="'Consolas',monospace" font-size="12" letter-spacing="1" fill="#8FD9CF">CONTENT, KEYWORDS &amp; META TAGS</text>

  <!-- Bottom layer = Technical SEO (this module) -->
  <polygon points="378,430 822,430 940,552 260,552" fill="#2DD4BF" stroke="#2DD4BF" stroke-width="1.5"/>
  <text x="600" y="498" text-anchor="middle" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="27" font-weight="900" fill="#08131F">TECHNICAL SEO</text>
  <text x="600" y="524" text-anchor="middle" font-family="'Consolas',monospace" font-size="13" letter-spacing="1.5" fill="#08131F" font-weight="700">THE FOUNDATION &#183; THIS GUIDE (MODULE 14)</text>

  <!-- Ground line + label -->
  <line x1="200" y1="552" x2="1000" y2="552" stroke="#F5A623" stroke-width="2"/>
  <path d="M 600 610 L 592 594 L 608 594 Z" fill="#F5A623"/>
  <text x="600" y="642" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#9FB0CC">Google crawls, renders, and indexes from this layer up —</text>
  <text x="600" y="666" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#9FB0CC">if this layer fails, nothing built on top of it gets evaluated.</text>
</svg>
