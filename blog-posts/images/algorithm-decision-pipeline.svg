<svg viewBox="0 0 920 430" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="pipeTitle pipeDesc">
  <title id="pipeTitle">The algorithmic decision pipeline</title>
  <desc id="pipeDesc">Data flows into a model, which is shaped into an objective and constraints, solved by an algorithm into a solution, validated, and turned into a decision.</desc>
  <defs>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D9A441"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="430" fill="#FBFBFA"/>

  <text x="460" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1E2A45">How an algorithm turns data into a decision</text>
  <text x="460" y="55" text-anchor="middle" font-size="12.5" fill="#64748B">The algorithm is only one link in the chain &#8212; every other link can quietly break the result</text>

  <!-- Row 1 -->
  <g font-size="14" font-weight="700">
    <g>
      <rect x="40" y="90" width="170" height="70" rx="10" fill="#1E2A45"/>
      <text x="125" y="120" text-anchor="middle" fill="#FBFBFA">DATA</text>
      <text x="125" y="140" text-anchor="middle" fill="#C7CEDB" font-size="10.5" font-weight="400">what you actually know</text>
    </g>
    <path d="M215 125 H262" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrowSlate)"/>
    <g>
      <rect x="267" y="90" width="170" height="70" rx="10" fill="#1E2A45"/>
      <text x="352" y="120" text-anchor="middle" fill="#FBFBFA">MODEL</text>
      <text x="352" y="140" text-anchor="middle" fill="#C7CEDB" font-size="10.5" font-weight="400">your assumptions, formalized</text>
    </g>
    <path d="M442 125 H489" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrowSlate)"/>
    <g>
      <rect x="494" y="90" width="170" height="70" rx="10" fill="#1E2A45"/>
      <text x="579" y="120" text-anchor="middle" fill="#FBFBFA">OBJECTIVE</text>
      <text x="579" y="140" text-anchor="middle" fill="#C7CEDB" font-size="10.5" font-weight="400">what "better" means</text>
    </g>
    <path d="M669 125 H716" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrowSlate)"/>
    <g>
      <rect x="721" y="90" width="160" height="70" rx="10" fill="#1E2A45"/>
      <text x="801" y="120" text-anchor="middle" fill="#FBFBFA">CONSTRAINTS</text>
      <text x="801" y="140" text-anchor="middle" fill="#C7CEDB" font-size="10.5" font-weight="400">what's actually allowed</text>
    </g>
  </g>

  <!-- Connector down -->
  <path d="M801 160 V200 Q801 215 786 215 H816 Q801 215 801 230" fill="none" stroke="#D9A441" stroke-width="2.5"/>
  <path d="M801 160 V225" fill="none" stroke="#D9A441" stroke-width="2.5" marker-end="url(#arrowAmber)"/>

  <!-- Row 2 (reads right to left) -->
  <g font-size="14" font-weight="700">
    <g>
      <rect x="721" y="230" width="160" height="70" rx="10" fill="#D9A441"/>
      <text x="801" y="260" text-anchor="middle" fill="#1E2A45">ALGORITHM</text>
      <text x="801" y="280" text-anchor="middle" fill="#5A4415" font-size="10.5" font-weight="400">the method that searches</text>
    </g>
    <path d="M716 265 H669" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrowSlate)"/>
    <g>
      <rect x="494" y="230" width="170" height="70" rx="10" fill="#1E2A45"/>
      <text x="579" y="260" text-anchor="middle" fill="#FBFBFA">SOLUTION</text>
      <text x="579" y="280" text-anchor="middle" fill="#C7CEDB" font-size="10.5" font-weight="400">the candidate answer</text>
    </g>
    <path d="M489 265 H442" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrowSlate)"/>
    <g>
      <rect x="267" y="230" width="170" height="70" rx="10" fill="#1E2A45"/>
      <text x="352" y="260" text-anchor="middle" fill="#FBFBFA">VALIDATION</text>
      <text x="352" y="280" text-anchor="middle" fill="#C7CEDB" font-size="10.5" font-weight="400">checked against reality</text>
    </g>
    <path d="M262 265 H215" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrowSlate)"/>
    <g>
      <rect x="40" y="230" width="170" height="70" rx="10" fill="#2F7C74"/>
      <text x="125" y="260" text-anchor="middle" fill="#FBFBFA">DECISION</text>
      <text x="125" y="280" text-anchor="middle" fill="#D9ECE8" font-size="10.5" font-weight="400">what actually happens</text>
    </g>
  </g>

  <!-- Footer note -->
  <line x1="40" y1="335" x2="881" y2="335" stroke="#DADFE7" stroke-width="1"/>
  <text x="460" y="365" text-anchor="middle" font-size="12.5" fill="#1E2A45" font-weight="700">A weak link anywhere upstream produces a confidently wrong decision</text>
  <text x="460" y="385" text-anchor="middle" font-size="11.5" fill="#64748B">Bad data, a mismatched model, the wrong objective, or a skipped validation step &#8212; the algorithm itself can be flawless and still fail</text>
  <text x="460" y="410" text-anchor="middle" font-size="10.5" fill="#9AA3B2">SmartGen Tools &#183; smartgentools.com</text>
</svg>
