  <text x="400" y="516" text-anchor="middle" fill="#4C1D95" font-size="9.5" font-weight="700">A button built with Auto Layout resizes itself — nothing manually re-measured</text>

  <text x="400" y="548" text-anchor="middle" fill="#9B8AC4" font-size="9" font-weight="600">See the three Auto Layout flow types below ↓</text>

