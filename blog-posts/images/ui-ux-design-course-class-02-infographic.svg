  <text x="89" y="226" fill="#1A1A1A" font-size="13.5" font-weight="700">Figma Basics</text>
  <text x="89" y="242" fill="#7C3AED" font-size="8.5" font-weight="700" letter-spacing="0.6">THE INTERFACE &amp; CORE TOOLS</text>
  <line x1="32" y1="256" x2="381" y2="256" stroke="#EDE4FB" stroke-width="1"/>

  <circle cx="40" cy="273" r="3.5" fill="#7C3AED"/>
