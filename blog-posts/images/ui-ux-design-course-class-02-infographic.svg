  <circle cx="40" cy="313" r="3.5" fill="#7C3AED"/>
  <text x="50" y="317" fill="#333" font-size="10.5" font-weight="600">F = Frame · T = Text · R/O = Shapes · V = Move</text>

  <rect x="32" y="332" width="348" height="28" rx="7" fill="#F5F0FE"/>
  <text x="206" y="350" text-anchor="middle" fill="#7C3AED" font-size="10" font-weight="700">Frames resize &amp; take Auto Layout — Groups can't</text>

