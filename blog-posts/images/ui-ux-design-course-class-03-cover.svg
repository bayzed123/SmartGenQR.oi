<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">

  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B1878;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1"/>
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="rgba(30,10,60,0.35)"/>
    </filter>
  </defs>

  <!-- BACKGROUND -->
  <rect width="800" height="420" fill="url(#bg-grad)"/>

  <!-- Decorative circles -->
  <circle cx="742" cy="55" r="150" fill="rgba(255,255,255,0.06)"/>
  <circle cx="55" cy="395" r="110" fill="rgba(255,255,255,0.05)"/>
  <circle cx="715" cy="390" r="55" fill="rgba(255,255,255,0.05)"/>

  <!-- ================================================ -->
  <!-- LEFT: TITLE BLOCK                                -->
  <!-- ================================================ -->

  <rect x="50" y="52" width="292" height="28" rx="14" fill="rgba(255,255,255,0.16)"/>
  <text x="65" y="71" fill="white" font-size="11" font-weight="700" letter-spacing="1">SMARTGEN UI/UX DESIGN COURSE</text>

  <text x="48" y="152" fill="white" font-size="44" font-weight="800" letter-spacing="-0.5">The UX Design</text>
  <text x="48" y="210" fill="white" font-size="44" font-weight="800" letter-spacing="-0.5">Process</text>

  <rect x="50" y="230" width="72" height="5" rx="2.5" fill="#FBBF24"/>

  <text x="50" y="268" fill="rgba(255,255,255,0.88)" font-size="16" font-weight="500">Class 03 — App Design &amp; UX Process,</text>
  <text x="50" y="292" fill="rgba(255,255,255,0.88)" font-size="16" font-weight="500">User Research &amp; User Personas</text>

  <!-- ================================================ -->
  <!-- RIGHT: MOCK PERSONA CARD + PROCESS STRIP         -->
  <!-- ================================================ -->
  <rect x="462" y="86" width="288" height="248" rx="18" fill="white" filter="url(#card-shadow)"/>

  <!-- Persona card mockup -->
  <text x="490" y="112" fill="#9CA3AF" font-size="8" font-weight="700" letter-spacing="0.5">USER PERSONA</text>

  <circle cx="512" cy="146" r="24" fill="#EDE4FB"/>
  <circle cx="512" cy="140" r="9" fill="#B9A2E8"/>
  <path d="M 496 158 Q 512 146 528 158" fill="#B9A2E8"/>

  <text x="548" y="140" fill="#1F2937" font-size="13" font-weight="700">Maya R.</text>
  <text x="548" y="156" fill="#8B5CF6" font-size="9.5" font-weight="600">"I just want it to work</text>
  <text x="548" y="168" fill="#8B5CF6" font-size="9.5" font-weight="600">the first time."</text>

  <line x1="490" y1="182" x2="730" y2="182" stroke="#F0F0F5" stroke-width="1.5"/>

  <text x="490" y="200" fill="#9CA3AF" font-size="8" font-weight="700" letter-spacing="0.5">GOALS</text>
  <rect x="490" y="207" width="120" height="7" rx="3.5" fill="#E5E1F0"/>
  <text x="490" y="228" fill="#9CA3AF" font-size="8" font-weight="700" letter-spacing="0.5">FRUSTRATIONS</text>
  <rect x="490" y="235" width="150" height="7" rx="3.5" fill="#DDD5F5"/>
  <rect x="490" y="247" width="100" height="7" rx="3.5" fill="#DDD5F5"/>

  <line x1="490" y1="264" x2="730" y2="264" stroke="#F0F0F5" stroke-width="1.5"/>

  <!-- Mini process timeline -->
  <text x="490" y="282" fill="#9CA3AF" font-size="8" font-weight="700" letter-spacing="0.5">THE UX PROCESS</text>

  <circle cx="500" cy="304" r="7" fill="#C4B5FD"/>
  <line x1="507" y1="304" x2="533" y2="304" stroke="#DCC9FA" stroke-width="2"/>
  <circle cx="540" cy="304" r="7" fill="#7C3AED"/>
  <line x1="547" y1="304" x2="573" y2="304" stroke="#DCC9FA" stroke-width="2"/>
  <circle cx="580" cy="304" r="7" fill="#7C3AED"/>
  <line x1="587" y1="304" x2="613" y2="304" stroke="#DCC9FA" stroke-width="2"/>
  <circle cx="620" cy="304" r="7" fill="#C4B5FD"/>
  <line x1="627" y1="304" x2="653" y2="304" stroke="#DCC9FA" stroke-width="2"/>
  <circle cx="660" cy="304" r="7" fill="#C4B5FD"/>
  <line x1="667" y1="304" x2="693" y2="304" stroke="#DCC9FA" stroke-width="2"/>
  <circle cx="700" cy="304" r="7" fill="#C4B5FD"/>

