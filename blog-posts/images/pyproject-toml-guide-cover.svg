<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">pyproject.toml Python Packaging Guide</title>
  <desc id="desc">A TOML project configuration flows through build configuration, dependencies, validation, and package publishing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071a37"/><stop offset="1" stop-color="#123d70"/></linearGradient>
    <linearGradient id="file" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#173d70"/><stop offset="1" stop-color="#0b2347"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020a18" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><path d="M0 760 C330 650 520 860 820 730 S1300 650 1600 760 V900 H0Z" fill="#0a2b55" opacity=".65"/>
  <text x="80" y="105" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="800" fill="#fff">pyproject.toml</text>
  <text x="80" y="160" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="600" fill="#91d9ff">Write • Configure • Publish</text>
  <g filter="url(#shadow)"><rect x="80" y="230" width="480" height="420" rx="24" fill="url(#file)" stroke="#4e93dd" stroke-width="2"/></g>
  <rect x="80" y="230" width="480" height="62" rx="24" fill="#2365b4"/><text x="120" y="270" font-family="monospace" font-size="26" font-weight="700" fill="#fff">pyproject.toml</text>
  <text x="125" y="350" font-family="monospace" font-size="23" fill="#ffd166">[project]</text><text x="125" y="390" font-family="monospace" font-size="20" fill="#9edbff">name = &quot;quickcache&quot;</text><text x="125" y="428" font-family="monospace" font-size="20" fill="#9edbff">version = &quot;0.1.0&quot;</text><text x="125" y="466" font-family="monospace" font-size="20" fill="#9edbff">dependencies = [ ... ]</text><text x="125" y="520" font-family="monospace" font-size="23" fill="#ffd166">[build-system]</text><text x="125" y="560" font-family="monospace" font-size="20" fill="#9edbff">requires = [ ... ]</text><text x="125" y="598" font-family="monospace" font-size="20" fill="#9edbff">build-backend = ...</text>
