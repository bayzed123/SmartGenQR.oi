  <g filter="url(#shadow)"><rect x="720" y="315" width="180" height="250" rx="22" fill="#fff"/><rect x="1010" y="315" width="180" height="250" rx="22" fill="#fff"/><rect x="1310" y="315" width="220" height="250" rx="22" fill="#fff"/></g>
  <rect x="765" y="370" width="90" height="90" rx="18" fill="#3b82d0"/><path d="M810 392 l28 16 v28 l-28 16-28-16v-28z" fill="#ffd166"/><text x="754" y="510" font-family="Inter,Arial" font-size="22" font-weight="700" fill="#193b6b">BUILD</text><text x="744" y="538" font-family="Inter,Arial" font-size="17" fill="#5f7595">wheel package</text>
  <rect x="1055" y="370" width="90" height="90" rx="18" fill="#19a7a1"/><path d="M1078 416 l16 16 30-35" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text x="1035" y="510" font-family="Inter,Arial" font-size="22" font-weight="700" fill="#193b6b">VALIDATE</text><text x="1036" y="538" font-family="Inter,Arial" font-size="17" fill="#5f7595">metadata checks</text>
  <rect x="1370" y="370" width="100" height="90" rx="18" fill="#eab64b"/><path d="M1420 390 v45 M1402 418 l18 18 18-18" stroke="#193b6b" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="1350" y="510" font-family="Inter,Arial" font-size="22" font-weight="700" fill="#193b6b">PUBLISH</text><text x="1350" y="538" font-family="Inter,Arial" font-size="17" fill="#5f7595">package index</text>
