  <text x="80" y="86" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="15" letter-spacing="3" fill="#F2A93B" font-weight="700">SMARTGEN PYTHON COURSE</text>
  <rect x="80" y="106" width="150" height="30" rx="15" fill="none" stroke="#F2A93B" stroke-width="1.5"/>
  <text x="98" y="126" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2" fill="#F6F1E4" font-weight="700">CLASS 08</text>

  <text x="78" y="245" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#F6F1E4">Input/Output &amp;</text>
  <text x="78" y="305" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#F6F1E4">Advanced Loops</text>

  <text x="80" y="356" font-family="'Courier New', monospace" font-size="19" fill="#4ED9AE">break &#183; continue &#183; pass &#183; for...else</text>

