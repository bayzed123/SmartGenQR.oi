<svg viewBox="0 0 920 500" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="cxTitle cxDesc">
  <title id="cxTitle">How different time complexities grow as input size increases</title>
  <desc id="cxDesc">Line chart comparing O(1), O(log n), O(n), O(n log n) and O(n squared) as the number of operations required grows with input size n.</desc>
  <rect x="0" y="0" width="920" height="500" fill="#FBFBFA"/>

  <text x="460" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1E2A45">Not all "slow" is the same kind of slow</text>
  <text x="460" y="53" text-anchor="middle" font-size="12.5" fill="#64748B">Operations required as input size n grows, for five common complexity classes</text>

  <!-- Axes -->
  <line x1="80" y1="60" x2="80" y2="420" stroke="#1E2A45" stroke-width="1.5"/>
  <line x1="80" y1="420" x2="870" y2="420" stroke="#1E2A45" stroke-width="1.5"/>
  <!-- gridlines -->
  <g stroke="#E7E9EE" stroke-width="1">
    <line x1="165.6" y1="60" x2="165.6" y2="420"/>
    <line x1="251.1" y1="60" x2="251.1" y2="420"/>
    <line x1="336.7" y1="60" x2="336.7" y2="420"/>
    <line x1="422.2" y1="60" x2="422.2" y2="420"/>
    <line x1="507.8" y1="60" x2="507.8" y2="420"/>
    <line x1="593.3" y1="60" x2="593.3" y2="420"/>
    <line x1="678.9" y1="60" x2="678.9" y2="420"/>
    <line x1="764.4" y1="60" x2="764.4" y2="420"/>
    <line x1="850" y1="60" x2="850" y2="420"/>
  </g>

  <text x="475" y="450" text-anchor="middle" font-size="12.5" fill="#1E2A45" font-weight="700">Input size (n) &#8594;</text>
  <text x="30" y="240" text-anchor="middle" font-size="12.5" fill="#1E2A45" font-weight="700" transform="rotate(-90 30 240)">Operations needed &#8594;</text>

  <!-- Curves -->
  <polyline points="80,416.4 165.6,416.4 251.1,416.4 336.7,416.4 422.2,416.4 507.8,416.4 593.3,416.4 678.9,416.4 764.4,416.4 850,416.4"
            fill="none" stroke="#2F7C74" stroke-width="3"/>
  <polyline points="80,420 165.6,416.4 251.1,414.3 336.7,412.8 422.2,411.6 507.8,410.7 593.3,409.9 678.9,409.2 764.4,408.6 850,408.1"
            fill="none" stroke="#64748B" stroke-width="3"/>
  <polyline points="80,416.4 165.6,412.8 251.1,409.2 336.7,405.6 422.2,402 507.8,398.4 593.3,394.8 678.9,391.2 764.4,387.6 850,384"
            fill="none" stroke="#1E2A45" stroke-width="3"/>
  <polyline points="80,420 165.6,412.8 251.1,402.9 336.7,391.2 422.2,378.2 507.8,364.2 593.3,349.3 678.9,333.6 764.4,317.4 850,300.5"
            fill="none" stroke="#D9A441" stroke-width="3.5"/>
  <polyline points="80,416.4 165.6,405.6 251.1,387.6 336.7,362.4 422.2,330 507.8,290.4 593.3,243.6 678.9,190.4 764.4,129.6 850,60"
            fill="none" stroke="#C1503F" stroke-width="3.5"/>

  <!-- End labels -->
  <text x="856" y="411" font-size="12" font-weight="700" fill="#2F7C74">O(1)</text>
  <text x="856" y="400" font-size="12" font-weight="700" fill="#64748B">O(log n)</text>
  <text x="856" y="388" font-size="12" font-weight="700" fill="#1E2A45">O(n)</text>
  <text x="774" y="295" font-size="12" font-weight="700" fill="#D9A441">O(n log n)</text>
  <text x="774" y="65" font-size="12" font-weight="700" fill="#C1503F">O(n&#178;)</text>

  <!-- Legend / reading key -->
  <line x1="80" y1="460" x2="870" y2="460" stroke="#DADFE7" stroke-width="1"/>
  <text x="80" y="484" font-size="12.5" fill="#1E2A45" font-weight="700">Same input, ten times bigger:</text>
  <text x="330" y="484" font-size="12" fill="#64748B">O(1) does the same work &#8226; O(log n) barely notices &#8226; O(n) does 10&#215; the work &#8226; O(n&#178;) does 100&#215; the work</text>
</svg>
