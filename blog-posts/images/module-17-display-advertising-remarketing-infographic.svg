<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Display Advertising and Remarketing Framework</title><desc id="d">A six-part framework covers campaign setup, audience, creative, remarketing, measurement, and optimization.</desc><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#edf4ff"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#16356c" flood-opacity=".15"/></filter></defs><rect width="1600" height="900" fill="url(#b)"/><text x="80" y="92" font-family="Arial" font-size="42" font-weight="800" fill="#16356c">Display Campaign Framework</text><text x="82" y="140" font-family="Arial" font-size="23" fill="#58719a">Build, target, test, and improve with a measurement-first workflow</text><g stroke="#4e83d9" stroke-width="4" fill="none"><path d="M400 330 H520"/><path d="M800 330 H920"/><path d="M1200 330 H1320"/><path d="M1320 610 H1200"/><path d="M920 610 H800"/><path d="M520 610 H400"/></g><g filter="url(#s)"><rect x="80" y="240" width="320" height="180" rx="22" fill="#fff"/><rect x="520" y="240" width="320" height="180" rx="22" fill="#fff"/><rect x="960" y="240" width="320" height="180" rx="22" fill="#fff"/><rect x="80" y="520" width="320" height="180" rx="22" fill="#fff"/><rect x="520" y="520" width="320" height="180" rx="22" fill="#fff"/><rect x="960" y="520" width="320" height="180" rx="22" fill="#fff"/></g><circle cx="145" cy="300" r="30" fill="#2467c8"/><text x="136" y="310" font-family="Arial" font-size="25" font-weight="700" fill="#fff">1</text><text x="195" y="304" font-family="Arial" font-size="24" font-weight="700" fill="#16356c">Setup</text><text x="120" y="350" font-family="Arial" font-size="17" fill="#58719a">goal, budget, landing page</text><circle cx="585" cy="300" r="30" fill="#19a7a1"/><text x="576" y="310" font-family="Arial" font-size="25" font-weight="700" fill="#fff">2</text><text x="635" y="304" font-family="Arial" font-size="24" font-weight="700" fill="#16356c">Audience</text><text x="560" y="350" font-family="Arial" font-size="17" fill="#58719a">intent, segments, exclusions</text><circle cx="1025" cy="300" r="30" fill="#ed9f35"/><text x="1016" y="310" font-family="Arial" font-size="25" font-weight="700" fill="#fff">3</text><text x="1075" y="304" font-family="Arial" font-size="24" font-weight="700" fill="#16356c">Creative</text><text x="1000" y="350" font-family="Arial" font-size="17" fill="#58719a">message, format, variants</text><circle cx="145" cy="580" r="30" fill="#6a59c7"/><text x="136" y="590" font-family="Arial" font-size="25" font-weight="700" fill="#fff">6</text><text x="195" y="584" font-family="Arial" font-size="24" font-weight="700" fill="#16356c">Optimize</text><text x="120" y="630" font-family="Arial" font-size="17" fill="#58719a">test, learn, reallocate</text><circle cx="585" cy="580" r="30" fill="#e85d75"/><text x="576" y="590" font-family="Arial" font-size="25" font-weight="700" fill="#fff">5</text><text x="635" y="584" font-family="Arial" font-size="24" font-weight="700" fill="#16356c">Measure</text><text x="560" y="630" font-family="Arial" font-size="17" fill="#58719a">CTR, CPA, ROAS, lift</text><circle cx="1025" cy="580" r="30" fill="#3c8fcb"/><text x="1016" y="590" font-family="Arial" font-size="25" font-weight="700" fill="#fff">4</text><text x="1075" y="584" font-family="Arial" font-size="24" font-weight="700" fill="#16356c">Remarket</text><text x="1000" y="630" font-family="Arial" font-size="17" fill="#58719a">return visits with relevance</text><text x="520" y="810" font-family="Arial" font-size="28" font-weight="800" fill="#2467c8">PLAN → LAUNCH → LEARN → IMPROVE</text></svg>
