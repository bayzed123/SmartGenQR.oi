<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1526"/>
      <stop offset="100%" stop-color="#1B2A4A"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <circle cx="1000" cy="140" r="150" fill="#4ED9AE" opacity="0.10" filter="url(#softGlow)"/>
  <circle cx="1080" cy="500" r="170" fill="#F1633C" opacity="0.08" filter="url(#softGlow)"/>

  <text x="80" y="86" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="15" letter-spacing="3" fill="#F2A93B" font-weight="700">SMARTGEN PYTHON COURSE</text>
  <rect x="80" y="106" width="150" height="30" rx="15" fill="none" stroke="#F2A93B" stroke-width="1.5"/>
  <text x="98" y="126" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2" fill="#F6F1E4" font-weight="700">CLASS 06</text>

  <text x="78" y="250" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" fill="#F6F1E4">Loop Exercises</text>
  <text x="78" y="322" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" fill="#F6F1E4">&amp; Strings</text>

  <text x="80" y="374" font-family="'Courier New', monospace" font-size="19" fill="#4ED9AE">name[::-1]  &#8226;  "Py" + "thon"  &#8226;  .split(",")</text>

  <rect x="80" y="400" width="480" height="2" fill="#2E3B5E"/>
  <text x="80" y="560" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="14" letter-spacing="2" fill="#4ED9AE" font-weight="700">PRACTICE &#183; INDEXING &#183; SLICING &#183; METHODS</text>

  <!-- string index ruler motif -->
  <g transform="translate(870,240)">
    <rect x="0" y="0" width="60" height="60" fill="#1B2540" stroke="#F2A93B" stroke-width="2"/>
    <text x="30" y="40" text-anchor="middle" font-family="'Courier New', monospace" font-size="26" fill="#F6F1E4">P</text>
    <text x="30" y="-10" text-anchor="middle" font-family="'Trebuchet MS', sans-serif" font-size="12" fill="#93A0C2">0</text>
    <rect x="65" y="0" width="60" height="60" fill="#1B2540" stroke="#4ED9AE" stroke-width="2"/>
    <text x="95" y="40" text-anchor="middle" font-family="'Courier New', monospace" font-size="26" fill="#F6F1E4">y</text>
    <text x="95" y="-10" text-anchor="middle" font-family="'Trebuchet MS', sans-serif" font-size="12" fill="#93A0C2">1</text>
    <rect x="130" y="0" width="60" height="60" fill="#1B2540" stroke="#F1633C" stroke-width="2"/>
    <text x="160" y="40" text-anchor="middle" font-family="'Courier New', monospace" font-size="26" fill="#F6F1E4">n</text>
    <text x="160" y="-10" text-anchor="middle" font-family="'Trebuchet MS', sans-serif" font-size="12" fill="#93A0C2">-1</text>
