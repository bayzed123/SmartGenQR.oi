<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Google Display Ad Sizes and Formats</title><desc id="d">A reference board compares common display ad formats by shape and purpose.</desc><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eaf3ff"/></linearGradient></defs><rect width="1600" height="900" fill="url(#b)"/><text x="80" y="95" font-family="Arial" font-size="42" font-weight="800" fill="#16356c">Display Ad Formats Reference</text><text x="82" y="140" font-family="Arial" font-size="23" fill="#58719a">Choose a format that fits the placement, message, and device context</text><g fill="#2467c8"><rect x="120" y="250" width="430" height="120" rx="15"/><rect x="120" y="470" width="430" height="120" rx="15"/><rect x="700" y="250" width="220" height="310" rx="15"/><rect x="1080" y="250" width="310" height="310" rx="15"/></g><g fill="#fff" font-family="Arial"><text x="240" y="315" font-size="27" font-weight="700">LEADERBOARD</text><text x="250" y="350" font-size="18">wide placements • clear offer</text><text x="235" y="535" font-size="27" font-weight="700">MOBILE BANNER</text><text x="215" y="570" font-size="18">compact message • thumb-friendly</text><text x="755" y="390" font-size="24" font-weight="700">SKYSCRAPER</text><text x="750" y="425" font-size="17">vertical reach</text><text x="1140" y="390" font-size="24" font-weight="700">SQUARE</text><text x="1130" y="425" font-size="17">flexible creative</text></g><g fill="#ed9f35"><rect x="120" y="700" width="250" height="75" rx="12"/><rect x="410" y="700" width="250" height="75" rx="12"/><rect x="700" y="700" width="250" height="75" rx="12"/><rect x="990" y="700" width="250" height="75" rx="12"/></g><g font-family="Arial" font-size="20" font-weight="700" fill="#5a3a0e"><text x="170" y="746">RESPONSIVE</text><text x="465" y="746">STATIC</text><text x="760" y="746">HTML5</text><text x="1035" y="746">