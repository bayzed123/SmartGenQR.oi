<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Keyword research and analysis framework</title>
  <desc id="desc">A central effective keyword research strategy connected to objectives, audience, research, competitor analysis, relevance, long-tail keywords, and monitoring.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#effcf8"/><stop offset="1" stop-color="#e7f4ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#19415a" flood-opacity=".14"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <text x="600" y="82" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="800" fill="#1e5360">Keyword Research &amp; Analysis</text>
  <text x="600" y="122" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#54717a">Turn search evidence into a focused content strategy.</text>
  <g stroke="#62a6a0" stroke-width="4" fill="none" opacity=".72">
    <path d="M600 315L250 220M600 315L600 210M600 315L950 220M600 315L250 410M600 315L950 410M600 315L250 520M600 315L600 520M600 315L950 520"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="420" y="250" width="360" height="130" rx="28" fill="#f6c65b" stroke="#e6ae36" stroke-width="3"/>
    <rect x="92" y="160" width="292" height="100" rx="22" fill="#ffffff" stroke="#b8ddd4" stroke-width="3"/>
    <rect x="454" y="150" width="292" height="100" rx="22" fill="#ffffff" stroke="#b8ddd4" stroke-width="3"/>
    <rect x="816" y="160" width="292" height="100" rx="22" fill="#ffffff" stroke="#b8ddd4" stroke-width="3"/>
    <rect x="92" y="360" width="292" height="100" rx="22" fill="#ffffff" stroke="#b8ddd4" stroke-width="3"/>
    <rect x="816" y="360" width="292" height="100" rx="22" fill="#ffffff" stroke="#b8ddd4" stroke-width="3"/>
    <rect x="92" y="470" width="292" height="100" rx="22" fill="#ffffff" stroke="#b8ddd4" stroke-width="3"/>
    <rect x="454" y="470" width="292" height="100" rx="22" fill="#ffffff" stroke="#b8ddd4" stroke-width="3"/>
    <rect x="816" y="470" width="292" height="100" rx="22" fill="#ffffff" stroke="#b8ddd4" stroke-width="3"/>
  </g>
  <g font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#204b57">
    <text x="600" y="298" font-size="25" font-weight="800">EFFECTIVE KEYWORD</text><text x="600" y="334" font-size="25" font-weight="800">RESEARCH STRATEGY</text>
    <text x="238" y="201" font-size="22" font-weight="700">Monitor &amp; adapt</text><text x="238" y="232" font-size="19">measure results</text>
    <text x="600" y="191" font-size="22" font-weight="700">Define objectives</text><text x="600" y="222" font-size="19">set the goal</text>
    <text x="962" y="201" font-size="22" font-weight="700">Identify audience</text><text x="962" y="232" font-size="19">match intent</text>
    <text x="238" y="401" font-size="22" font-weight="700">Use long-tail terms</text><text x="238" y="432" font-size="19">capture specificity</text>
    <text x="962" y="401" font-size="22" font-weight="700">Research deeply</text><text x="962" y="432" font-size="19">validate the SERP</text>
    <text x="238" y="511" font-size="22" font-weight="700">Prioritize relevance</text><text x="238" y="542" font-size="19">balance volume</text>
    <text x="600" y="511" font-size="22" font-weight="700">Analyze competitors</text><text x="600" y="542" font-size="19">find opportunities</text>
    <text x="962" y="511" font-size="22" font-weight="700">Map content</text><text x="962" y="542" font-size="19">build the cluster</text>
  </g>
</svg>
