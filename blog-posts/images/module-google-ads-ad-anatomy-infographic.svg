  <line x1="884" y1="420" x2="700" y2="352" stroke="#F2A93B" stroke-dasharray="3 4" opacity="0.5"/>
  <text x="925" y="416" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#F6F1E4">Callout Extensions</text>
  <text x="925" y="435" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="12" fill="#93A0C2">Short trust and benefit phrases</text>

  <circle cx="900" cy="480" r="16" fill="#1B2540" stroke="#F1633C" stroke-width="2"/>
  <text x="900" y="485" text-anchor="middle" font-family="'Trebuchet MS', sans-serif" font-size="13" fill="#F1633C" font-weight="700">6</text>
  <line x1="884" y1="480" x2="700" y2="382" stroke="#F1633C" stroke-dasharray="3 4" opacity="0.5"/>
  <text x="925" y="476" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#F6F1E4">Structured Snippets</text>
  <text x="925" y="495" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="12" fill="#93A0C2">A themed list, like Types or Brands</text>

  <text x="650" y="785" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1.5" fill="#4ED9AE" font-weight="700">SMARTGEN DIGITAL MARKETING COURSE &#183; MODULE 19</text>
