<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">TikTok Marketing Framework</title><desc id="desc">A four-stage TikTok marketing framework moves from audience research through short-form creation, community, and analytics.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8ffff"/><stop offset="1" stop-color="#eaf5ff"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#12345a" flood-opacity=".16"/></filter></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="80" y="92" font-family="Inter,Arial" font-size="42" font-weight="800" fill="#142d55">TikTok Marketing Framework</text><text x="82" y="140" font-family="Inter,Arial" font-size="23" fill="#58718d">A repeatable system for short-form content, community, and measurable growth</text><g stroke="#11a7a7" stroke-width="5" fill="none"><path d="M410 450 H530"/><path d="M780 450 H900"/><path d="M1150 450 H1270"/></g><g fill="#11a7a7"><path d="M530 450 l-22-15 v30z"/><path d="M900 450 l-22-15 v30z"/><path d="M1270 450 l-22-15 v30z"/></g><g filter="url(#shadow)"><rect x="80" y="260" width="330" height="380" rx="24" fill="#fff"/><rect x="450" y="260" width="330" height="380" rx="24" fill="#fff"/><rect x="820" y="260" width="330" height="380" rx="24" fill="#fff"/><rect x="1190" y="260" width="330" height="380" rx="24" fill="#fff"/></g><circle cx="245" cy="350" r="58" fill="#ff4f89"/><path d="M218 350 h54 M245 323 v54" stroke="#fff" stroke-width="10" stroke-linecap="round"/><text x="145" y="455" font-family="Inter,Arial" font-size="27" font-weight="800" fill="#142d55">1. Discover</text><text x="125" y="500" font-family="Inter,Arial" font-size="18" fill="#58718d">audience needs</text><text x="125" y="530" font-family="Inter,Arial" font-size="18" fill="#58718d">search and trends</text><text x="125" y="560" font-family="Inter,Arial" font-size="18" fill="#58718d">content opportunities</text><circle cx="615" cy="350" r="58" fill="#11a7a7"/><path d="M588 350 l18 18 35-42" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><text x="515" y="455" font-family="Inter,Arial" font-size="27" font-weight="800" fill="#142d55">2. Create</text><text x="495" y="500" font-family="Inter,Arial" font-size="18" fill="#58718d">strong first seconds</text><text x="495" y="530" font-family="Inter,Arial" font-size="18" fill="#58718d">native short-form story</text><text x="495" y="560" font-family="Inter,Arial" font-size="18" fill="#58718d">clear call to action</text><circle cx="985" cy="350" r="58" fill="#ffb43b"/><path d="M957 350 h56 M985 322 v56" stroke="#fff" stroke-width="9" stroke-linecap="round"/><text x="865" y="455" font-family="Inter,Arial" font-size="27" font-weight="800" fill="#142d55">3. Connect</text><text x="865" y="500" font-family="Inter,Arial" font-size="18" fill="#58718d">reply to comments</text><text x="865" y="530" font-family="Inter,Arial" font-size="18" fill="#58718d">build community</text><text x="865" y="560" font-family="Inter,Arial" font-size="18" fill="#58718d">test collaborations</text><circle cx="1355" cy="350" r="58" fill="#5b57c9"/><path d="M1327 370 l18-35 17 20 24-38" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text x="1260" y="455" font-family="Inter,Arial" font-size="27" font-weight="800" fill="#142d55">4. Learn</text><text x="1245" y="500" font-family="Inter,Arial" font-size="18" fill="#58718d">retention and reach</text><text x="1245" y="530" font-family="Inter,Arial" font-size="18" fill="#58718d">engagement signals</text><text x="1245" y="560" font-family="Inter,Arial" font-size="18" fill="#58718d">iterate the next post</text><path d="M150 740 H1450" stroke="#bcd7dd" stroke-width="4"/><text x="485" y="805" font-family="Inter,Arial" font-size="28" font-weight="800" fill="#11a7a7">POST → RESPOND → MEASURE → IMPROVE</text></svg>
