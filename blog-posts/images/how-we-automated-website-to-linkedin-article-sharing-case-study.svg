<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Website to LinkedIn article automation case study</title>
  <desc id="desc">A visual workflow connecting a website article to GitHub Actions and LinkedIn.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#173b67"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1050" cy="90" r="210" fill="#2563eb" opacity=".16"/>
  <circle cx="140" cy="580" r="240" fill="#06b6d4" opacity=".10"/>
  <rect x="70" y="70" width="1060" height="490" rx="28" fill="#0f172a" opacity=".76" stroke="#334155"/>
  <text x="120" y="160" fill="#93c5fd" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" letter-spacing="3">SMARTGEN CASE STUDY</text>
  <text x="120" y="225" fill="#f8fafc" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="800">Website → LinkedIn</text>
  <text x="120" y="280" fill="#f8fafc" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="800">Article Automation</text>
  <text x="122" y="327" fill="#cbd5e1" font-family="Arial,Helvetica,sans-serif" font-size="23">GitHub Actions · LinkedIn API · SEO-safe URLs</text>
  <g filter="url(#shadow)">
    <rect x="120" y="390" width="230" height="105" rx="18" fill="#f8fafc"/>
    <rect x="485" y="390" width="230" height="105" rx="18" fill="#111827" stroke="#374151"/>
    <rect x="850" y="390" width="230" height="105" rx="18" fill="#0a66c2"/>
  </g>
  <g fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round">
    <path d="M355 442h105"/>
    <path d="M720 442h105"/>
  </g>
  <g fill="#22d3ee">
    <path d="m445 425 28 17-28 17z"/>
    <path d="m810 425 28 17-28 17z"/>
  </g>
  <g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
    <text x="235" y="433" fill="#0f172a" font-size="25" font-weight="800">WEBSITE</text>
    <text x="235" y="468" fill="#475569" font-size="19">Markdown article</text>
    <text x="600" y="433" fill="#f8fafc" font-size="25" font-weight="800">ACTIONS</text>
    <text x="600" y="468" fill="#cbd5e1" font-size="19">Build + verify</text>
    <text x="965" y="433" fill="#fff" font-size="25" font-weight="800">LINKEDIN</text>
    <text x="965" y="468" fill="#dbeafe" font-size="19">Article share</text>
  </g>
  <rect x="120" y="520" width="960" height="5" rx="2" fill="url(#accent)"/>
</svg>
