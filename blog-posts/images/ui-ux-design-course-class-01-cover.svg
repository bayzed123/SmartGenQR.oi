<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">

  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B1878;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1"/>
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="rgba(30,10,60,0.35)"/>
    </filter>
  </defs>

  <!-- BACKGROUND -->
  <rect width="800" height="420" fill="url(#bg-grad)"/>

  <!-- Decorative circles -->
  <circle cx="742" cy="55" r="150" fill="rgba(255,255,255,0.06)"/>
  <circle cx="55" cy="395" r="110" fill="rgba(255,255,255,0.05)"/>
  <circle cx="715" cy="390" r="55" fill="rgba(255,255,255,0.05)"/>

  <!-- ================================================ -->
  <!-- LEFT: TITLE BLOCK                                -->
  <!-- ================================================ -->

  <!-- Badge -->
  <rect x="50" y="52" width="292" height="28" rx="14" fill="rgba(255,255,255,0.16)"/>
  <text x="65" y="71" fill="white" font-size="11" font-weight="700" letter-spacing="1">SMARTGEN UI/UX DESIGN COURSE</text>

  <!-- Title -->
  <text x="48" y="152" fill="white" font-size="50" font-weight="800" letter-spacing="-0.5">UI/UX Design</text>
  <text x="48" y="210" fill="white" font-size="50" font-weight="800" letter-spacing="-0.5">Fundamentals</text>

  <!-- Accent underline (demonstrating a warm accent against a cool background) -->
  <rect x="50" y="230" width="72" height="5" rx="2.5" fill="#FBBF24"/>

  <!-- Subtitle -->
  <text x="50" y="268" fill="rgba(255,255,255,0.88)" font-size="16" font-weight="500">Class 01 — Color Theory, Color Psychology,</text>
  <text x="50" y="292" fill="rgba(255,255,255,0.88)" font-size="16" font-weight="500">Typography &amp; Core Design Principles</text>

  <!-- ================================================ -->
  <!-- RIGHT: MOCK DESIGN CARD                          -->
  <!-- ================================================ -->
  <rect x="462" y="86" width="288" height="248" rx="18" fill="white" filter="url(#card-shadow)"/>

  <!-- Color palette row -->
  <text x="490" y="118" fill="#9CA3AF" font-size="9.5" font-weight="700" letter-spacing="0.8">COLOR PALETTE</text>
  <circle cx="500" cy="142" r="15" fill="#7C3AED"/>
  <circle cx="540" cy="142" r="15" fill="#FBBF24"/>
  <circle cx="580" cy="142" r="15" fill="#22C55E"/>
  <circle cx="620" cy="142" r="15" fill="#3B82F6"/>

  <line x1="490" y1="168" x2="722" y2="168" stroke="#F0F0F5" stroke-width="1.5"/>

  <!-- Typography hierarchy -->
  <text x="490" y="188" fill="#9CA3AF" font-size="9.5" font-weight="700" letter-spacing="0.8">TYPOGRAPHY HIERARCHY</text>
  <text x="490" y="232" fill="#1F2937" font-size="40" font-weight="800">Aa</text>
  <text x="560" y="224" fill="#4B5563" font-size="19" font-weight="600">Aa</text>
  <text x="610" y="224" fill="#9CA3AF" font-size="13" font-weight="400">Aa</text>

  <line x1="490" y1="248" x2="722" y2="248" stroke="#F0F0F5" stroke-width="1.5"/>

  <!-- Button mock (feedback & affordance) -->
  <text x="490" y="268" fill="#9CA3AF" font-size="9.5" font-weight="700" letter-spacing="0.8">FEEDBACK &amp; AFFORDANCE</text>
  <rect x="490" y="278" width="164" height="38" rx="9" fill="#7C3AED"/>
  <text x="572" y="302" text-anchor="middle" fill="white" font-size="13" font-weight="700">Get Started</text>

  <!-- ================================================ -->
  <!-- BOTTOM BYLINE STRIP                              -->
  <!-- ================================================ -->
  <line x1="50" y1="374" x2="750" y2="374" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
  <text x="50" y="398" fill="rgba(255,255,255,0.78)" font-size="12.5">smartgentools.com  ·  By Sayad Md Bayezid Hosan  ·  Class 01</text>

</svg>