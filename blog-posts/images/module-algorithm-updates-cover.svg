<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1526"/>
      <stop offset="100%" stop-color="#1B2A4A"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="dotGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- ambient blobs -->
  <circle cx="1000" cy="130" r="150" fill="#4ED9AE" opacity="0.10" filter="url(#softGlow)"/>
  <circle cx="1080" cy="500" r="170" fill="#F1633C" opacity="0.08" filter="url(#softGlow)"/>

  <!-- faint mechanism ring (algorithm / gear motif) -->
  <circle cx="990" cy="330" r="205" fill="none" stroke="#F2A93B" stroke-width="1.5" stroke-dasharray="3 10" opacity="0.18"/>
  <g stroke="#F2A93B" stroke-width="2" opacity="0.12">
    <line x1="990" y1="100" x2="990" y2="125"/>
    <line x1="990" y1="535" x2="990" y2="560"/>
    <line x1="760" y1="330" x2="785" y2="330"/>
    <line x1="1195" y1="330" x2="1220" y2="330"/>
  </g>

  <!-- radar rings -->
  <circle cx="990" cy="330" r="40" fill="none" stroke="#4ED9AE" stroke-width="1.5" opacity="0.5"/>
  <circle cx="990" cy="330" r="85" fill="none" stroke="#4ED9AE" stroke-width="1.5" opacity="0.35"/>
  <circle cx="990" cy="330" r="130" fill="none" stroke="#4ED9AE" stroke-width="1.5" opacity="0.22"/>

  <!-- sweeping scan wedge -->
  <path d="M990,330 L990,200 A130,130 0 0,1 1102,265 Z" fill="#F2A93B" opacity="0.14"/>
  <line x1="990" y1="330" x2="1102" y2="265" stroke="#F2A93B" stroke-width="2" opacity="0.7"/>

  <!-- signal blips -->
  <circle cx="990" cy="290" r="6" fill="#F2A93B" filter="url(#dotGlow)"/>
  <circle cx="1045" cy="350" r="6" fill="#4ED9AE" filter="url(#dotGlow)"/>
  <circle cx="945" cy="365" r="6" fill="#F1633C" filter="url(#dotGlow)"/>
  <circle cx="1055" cy="270" r="5" fill="#F6F1E4" filter="url(#dotGlow)" opacity="0.8"/>

  <!-- small paw print icon (Panda) -->
  <g transform="translate(945,365)" fill="#F1633C">
    <ellipse cx="0" cy="4" rx="9" ry="7"/>
    <circle cx="-8" cy="-7" r="3.4"/>
    <circle cx="0" cy="-11" r="3.4"/>
    <circle cx="8" cy="-7" r="3.4"/>
  </g>

  <!-- small chain-link icon (Penguin) -->
  <g transform="translate(1045,350)" stroke="#4ED9AE" stroke-width="2.4" fill="none">
    <rect x="-9" y="-5" width="10" height="10" rx="4"/>
    <rect x="0" y="-5" width="10" height="10" rx="4"/>
  </g>

  <!-- eyebrow -->
  <text x="80" y="86" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="15" letter-spacing="3" fill="#F2A93B" font-weight="700">SMARTGEN DIGITAL MARKETING COURSE</text>

  <!-- module pill -->
  <rect x="80" y="106" width="128" height="30" rx="15" fill="none" stroke="#F2A93B" stroke-width="1.5"/>
  <text x="98" y="126" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2" fill="#F6F1E4" font-weight="700">MODULE 13</text>

  <!-- headline -->
  <text x="78" y="255" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="700" fill="#F6F1E4">Algorithm</text>
  <text x="78" y="345" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="700" fill="#F6F1E4">Updates</text>

  <!-- subhead -->
  <text x="80" y="398" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="21.5" fill="#93A0C2">From Panda to BERT — what changed, and how to stay safe</text>

  <!-- divider -->
  <rect x="80" y="426" width="480" height="2" fill="#2E3B5E"/>

  <!-- bottom tags -->
  <text x="80" y="560" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="14.5" letter-spacing="2" fill="#4ED9AE" font-weight="700">UPDATES &#183; ALGORITHM ROLES &#183; PENALTIES &#183; PREVENTION</text>
</svg>
