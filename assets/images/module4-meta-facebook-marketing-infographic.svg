<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#1B2538"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#bg4)"/>

  <text x="60" y="70" font-family="Georgia, serif" font-size="34" fill="#F8FAFC" font-weight="bold">The Meta (Facebook) Marketing Ecosystem</text>
  <text x="60" y="100" font-family="Arial, sans-serif" font-size="16" fill="#94A3B8">Module 4 — How everything connects</text>

  <!-- Business Manager box (top, central umbrella) -->
  <rect x="430" y="140" width="340" height="80" rx="10" fill="#1877F2" opacity="0.18" stroke="#1877F2" stroke-width="2"/>
  <text x="600" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#F8FAFC" font-weight="bold">Business Manager</text>
  <text x="600" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">Organizes all your assets</text>

  <!-- Lines down to three children -->
  <line x1="600" y1="220" x2="220" y2="300" stroke="#475569" stroke-width="1.5"/>
  <line x1="600" y1="220" x2="600" y2="300" stroke="#475569" stroke-width="1.5"/>
  <line x1="600" y1="220" x2="980" y2="300" stroke="#475569" stroke-width="1.5"/>

  <!-- Page -->
  <rect x="80" y="300" width="280" height="90" rx="10" fill="#22C55E" opacity="0.15" stroke="#22C55E" stroke-width="2"/>
  <text x="220" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#F8FAFC" font-weight="bold">Facebook Page</text>
  <text x="220" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">Your business storefront</text>
  <text x="220" y="376" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">Posts, followers, Shop</text>

  <!-- Business Suite -->
  <rect x="460" y="300" width="280" height="90" rx="10" fill="#A855F7" opacity="0.15" stroke="#A855F7" stroke-width="2"/>
  <text x="600" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#F8FAFC" font-weight="bold">Business Suite</text>
  <text x="600" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">Daily content + inbox</text>
  <text x="600" y="376" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">Across FB and Instagram</text>

  <!-- Ad Account / Ads Manager -->
  <rect x="840" y="300" width="280" height="90" rx="10" fill="#F59E0B" opacity="0.15" stroke="#F59E0B" stroke-width="2"/>
  <text x="980" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#F8FAFC" font-weight="bold">Ads Manager</text>
  <text x="980" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">Campaigns, targeting,</text>
  <text x="980" y="368" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">Ad Account + payment</text>

  <!-- bottom row: campaign structure -->
  <text x="60" y="460" font-family="Georgia, serif" font-size="22" fill="#F8FAFC" font-weight="bold">Campaign Structure (Inside Ads Manager)</text>

  <rect x="80" y="490" width="300" height="70" rx="8" fill="#EF4444" opacity="0.15" stroke="#EF4444" stroke-width="2"/>
  <text x="230" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#F8FAFC" font-weight="bold">Campaign</text>
  <text x="230" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">Sets the objective</text>

  <text x="410" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#64748B">→</text>

  <rect x="450" y="490" width="300" height="70" rx="8" fill="#06B6D4" opacity="0.15" stroke="#06B6D4" stroke-width="2"/>
  <text x="600" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#F8FAFC" font-weight="bold">Ad Set</text>
  <text x="600" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">Audience, budget, schedule</text>

  <text x="780" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#64748B">→</text>

  <rect x="820" y="490" width="300" height="70" rx="8" fill="#EC4899" opacity="0.15" stroke="#EC4899" stroke-width="2"/>
  <text x="970" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#F8FAFC" font-weight="bold">Ad</text>
  <text x="970" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">Creative, copy, CTA</text>

  <text x="60" y="650" font-family="Arial, sans-serif" font-size="13" fill="#64748B">Original graphic created for SmartGen Blog — free to use, no copyright restrictions.</text>
</svg>
