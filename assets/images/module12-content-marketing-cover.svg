<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1526"/>
      <stop offset="100%" stop-color="#1B2A4A"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="dotGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- ambient blobs -->
  <circle cx="1010" cy="130" r="150" fill="#4ED9AE" opacity="0.10" filter="url(#softGlow)"/>
  <circle cx="1110" cy="520" r="170" fill="#F1633C" opacity="0.09" filter="url(#softGlow)"/>

  <!-- ghost letters A / Z -->
  <text x="838" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="260" font-weight="700" fill="#F6F1E4" opacity="0.06">A</text>
  <text x="978" y="560" font-family="Georgia, 'Times New Roman', serif" font-size="260" font-weight="700" fill="#F6F1E4" opacity="0.06">Z</text>

  <!-- eyebrow -->
  <text x="80" y="86" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="15" letter-spacing="3" fill="#F2A93B" font-weight="700">SMARTGEN DIGITAL MARKETING COURSE</text>

  <!-- module pill -->
  <rect x="80" y="106" width="128" height="30" rx="15" fill="none" stroke="#F2A93B" stroke-width="1.5"/>
  <text x="98" y="126" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2" fill="#F6F1E4" font-weight="700">MODULE 12</text>

  <!-- headline -->
  <text x="78" y="255" font-family="Georgia, 'Times New Roman', serif" font-size="90" font-weight="700" fill="#F6F1E4">Content</text>
  <text x="78" y="345" font-family="Georgia, 'Times New Roman', serif" font-size="90" font-weight="700" fill="#F6F1E4">Marketing</text>

  <!-- subhead -->
  <text x="80" y="400" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="24" fill="#93A0C2">The Complete A&#8594;Z Mega Guide for Beginners</text>

  <!-- divider -->
  <rect x="80" y="428" width="460" height="2" fill="#2E3B5E"/>

  <!-- bottom tags -->
  <text x="80" y="562" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="14.5" letter-spacing="2" fill="#4ED9AE" font-weight="700">STRATEGY &#183; FORMULA &#183; WRITING &#183; BUCKETING &#183; MEASUREMENT</text>

  <!-- winding signature path -->
  <path d="M900,90 C1020,150 840,260 980,320 C1100,380 900,460 1080,560" fill="none" stroke="#F2A93B" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>

  <!-- pen nib at path start -->
  <g transform="translate(900,90)">
    <polygon points="0,-14 10,10 -10,10" fill="#F6F1E4"/>
    <rect x="-3" y="-26" width="6" height="16" fill="#F6F1E4"/>
  </g>

  <!-- node 1 + article icon -->
  <circle cx="955" cy="190" r="7" fill="#F2A93B" filter="url(#dotGlow)"/>
  <g transform="translate(868,150)">
    <rect x="0" y="0" width="42" height="52" rx="7" fill="#1B2540" stroke="#F2A93B" stroke-width="1.5"/>
    <line x1="9" y1="15" x2="33" y2="15" stroke="#F6F1E4" stroke-width="2"/>
    <line x1="9" y1="26" x2="33" y2="26" stroke="#F6F1E4" stroke-width="2"/>
    <line x1="9" y1="37" x2="25" y2="37" stroke="#F6F1E4" stroke-width="2"/>
  </g>

  <!-- node 2 -->
  <circle cx="930" cy="300" r="7" fill="#4ED9AE" filter="url(#dotGlow)"/>

  <!-- node 3 + chart icon -->
  <circle cx="1000" cy="400" r="7" fill="#F1633C" filter="url(#dotGlow)"/>
  <g transform="translate(1028,368)">
    <rect x="0" y="22" width="9" height="20" fill="#F6F1E4"/>
    <rect x="13" y="8" width="9" height="34" fill="#F6F1E4"/>
    <rect x="26" y="0" width="9" height="42" fill="#F6F1E4"/>
  </g>

  <!-- finish target at path end -->
  <g transform="translate(1080,560)">
    <circle r="17" fill="none" stroke="#F6F1E4" stroke-width="2"/>
    <circle r="10" fill="none" stroke="#F6F1E4" stroke-width="2"/>
    <circle r="3.5" fill="#F6F1E4"/>
  </g>
</svg>
