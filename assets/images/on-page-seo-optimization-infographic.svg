  <rect x="400" y="832" width="174" height="26" rx="6" fill="rgba(255,255,255,0.14)"/>
  <text x="487" y="849" text-anchor="middle" fill="white" font-size="9.5" font-weight="600">Sitemap Finder →</text>

  <rect x="584" y="832" width="174" height="26" rx="6" fill="rgba(255,255,255,0.14)"/>
