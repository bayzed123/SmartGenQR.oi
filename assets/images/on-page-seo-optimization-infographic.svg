  <rect y="886" width="800" height="80" fill="#0F3B21"/>

  <text x="400" y="906" text-anchor="middle" fill="white" font-size="11.5" font-weight="700" letter-spacing="1.5">THE ON-PAGE SEO WORKFLOW</text>

  <!-- Step 1 -->
  <text x="40" y="926" text-anchor="middle" fill="#5BC08A" font-size="9" font-weight="700">AUDIT</text>
  <text x="40" y="939" text-anchor="middle" fill="#4A7A60" font-size="8">Crawl + Find</text>
  <text x="97" y="933" text-anchor="middle" fill="#3A6A50" font-size="14">›</text>
  <!-- Step 2 -->
  <text x="152" y="926" text-anchor="middle" fill="#5BC08A" font-size="9" font-weight="700">OPTIMIZE</text>
  <text x="152" y="939" text-anchor="middle" fill="#4A7A60" font-size="8">Tags + Headers</text>
  <text x="213" y="933" text-anchor="middle" fill="#3A6A50" font-size="14">›</text>
  <!-- Step 3 -->
  <text x="265" y="926" text-anchor="middle" fill="#5BC08A" font-size="9" font-weight="700">COMPRESS</text>
  <text x="265" y="939" text-anchor="middle" fill="#4A7A60" font-size="8">Media + Speed</text>
  <text x="328" y="933" text-anchor="middle" fill="#3A6A50" font-size="14">›</text>
  <!-- Step 4 -->
  <text x="380" y="926" text-anchor="middle" fill="#5BC08A" font-size="9" font-weight="700">STRUCTURE</text>
  <text x="380" y="939" text-anchor="middle" fill="#4A7A60" font-size="8">URLs + Links</text>
  <text x="444" y="933" text-anchor="middle" fill="#3A6A50" font-size="14">›</text>
  <!-- Step 5 -->
  <text x="500" y="926" text-anchor="middle" fill="#5BC08A" font-size="9" font-weight="700">REDIRECT</text>
  <text x="500" y="939" text-anchor="middle" fill="#4A7A60" font-size="8">301s + 404s</text>
  <text x="558" y="933" text-anchor="middle" fill="#3A6A50" font-size="14">›</text>
  <!-- Step 6 -->
  <text x="618" y="926" text-anchor="middle" fill="#5BC08A" font-size="9" font-weight="700">COMMUNICATE</text>
  <text x="618" y="939" text-anchor="middle" fill="#4A7A60" font-size="8">Sitemap + Robots</text>
