<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1526"/>
      <stop offset="100%" stop-color="#1B2A4A"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="dotGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <circle cx="1000" cy="140" r="150" fill="#4ED9AE" opacity="0.10" filter="url(#softGlow)"/>
  <circle cx="1080" cy="500" r="170" fill="#F1633C" opacity="0.08" filter="url(#softGlow)"/>

  <text x="80" y="86" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="15" letter-spacing="3" fill="#F2A93B" font-weight="700">SMARTGEN PYTHON COURSE</text>

  <rect x="80" y="106" width="150" height="30" rx="15" fill="none" stroke="#F2A93B" stroke-width="1.5"/>
  <text x="98" y="126" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2" fill="#F6F1E4" font-weight="700">CLASS 02</text>

  <text x="78" y="255" font-family="Georgia, 'Times New Roman', serif" font-size="86" font-weight="700" fill="#F6F1E4">Python</text>

  <!-- code-style subtitle -->
  <text x="80" y="320" font-family="'Courier New', monospace" font-size="26" fill="#4ED9AE">print("Hello, World!")</text>

  <text x="80" y="390" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="20.5" fill="#93A0C2">What it is, why it matters, and how to run it today</text>

  <rect x="80" y="418" width="480" height="2" fill="#2E3B5E"/>

  <text x="80" y="560" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="14" letter-spacing="2" fill="#4ED9AE" font-weight="700">HISTORY &#183; USES &#183; FRAMEWORKS &#183; FIRST CODE</text>

  <!-- python-esque interlocking shapes -->
  <g transform="translate(990,280)">
    <path d="M-50,-70 h80 a20,20 0 0 1 20,20 v30 a20,20 0 0 1 -20,20 h-60 v20 a20,20 0 0 0 20,20 h60" fill="none" stroke="#F2A93B" stroke-width="8" stroke-linecap="round"/>
    <path d="M50,90 h-80 a20,20 0 0 1 -20,-20 v-30 a20,20 0 0 1 20,-20 h60 v-20 a20,20 0 0 0 -20,-20 h-60" fill="none" stroke="#4ED9AE" stroke-width="8" stroke-linecap="round"/>
    <circle cx="-28" cy="-50" r="6" fill="#0F1526"/>
    <circle cx="28" cy="50" r="6" fill="#0F1526"/>
  </g>
</svg>
