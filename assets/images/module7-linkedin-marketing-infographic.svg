  <text x="467" y="896" text-anchor="middle" fill="#7A90A6" font-size="8">Page + Advocacy</text>
  <!-- Arrow -->
  <text x="534" y="890" text-anchor="middle" fill="#3A5A78" font-size="15">›</text>
