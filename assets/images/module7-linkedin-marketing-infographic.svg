  <rect x="20" y="520" width="5" height="148" rx="2.5" fill="#0A66C2"/>
  <circle cx="63" cy="544" r="18" fill="#0A66C2"/>
  <text x="63" y="550" text-anchor="middle" fill="white" font-size="14" font-weight="700">5</text>
  <text x="89" y="540" fill="#1A1A1A" font-size="13" font-weight="700">Building &amp; Engaging Your Network</text>
  <text x="89" y="556" fill="#0A66C2" font-size="8.5" font-weight="700" letter-spacing="0.6">CONNECTIONS, REACH &amp; RELATIONSHIPS</text>
  <line x1="32" y1="568" x2="381" y2="568" stroke="#DDEAFF" stroke-width="1"/>
  <circle cx="40" cy="584" r="3.5" fill="#0A66C2"/>
  <text x="50" y="588" fill="#333" font-size="10" font-weight="600">Personalize every request — blank requests get ignored or declined</text>
  <circle cx="40" cy="602" r="3.5" fill="#0A66C2"/>
  <text x="50" y="606" fill="#333" font-size="10" font-weight="600">500 relevant connections beats 5,000 random ones every time</text>
  <circle cx="40" cy="620" r="3.5" fill="#0A66C2"/>
  <text x="50" y="624" fill="#333" font-size="10" font-weight="600">Engage first, then connect — comment before you ever cold pitch</text>
  <rect x="32" y="638" width="348" height="22" rx="6" fill="#EEF4FF"/>
  <text x="206" y="653" text-anchor="middle" fill="#0A66C2" font-size="9.5" font-weight="700">Never pitch immediately after a connection request is accepted</text>

  <!-- CARD 6: LinkedIn for Company Pages -->
  <rect x="408" y="520" width="372" height="148" rx="10" fill="white" filter="url(#card-shadow)"/>
  <rect x="408" y="520" width="5" height="148" rx="2.5" fill="#0C5CAC"/>
  <circle cx="451" cy="544" r="18" fill="#0C5CAC"/>
  <text x="451" y="550" text-anchor="middle" fill="white" font-size="14" font-weight="700">6</text>
  <text x="477" y="540" fill="#1A1A1A" font-size="13" font-weight="700">LinkedIn for Company Pages</text>
  <text x="477" y="556" fill="#0C5CAC" font-size="8.5" font-weight="700" letter-spacing="0.6">BRAND PRESENCE &amp; EMPLOYEE ADVOCACY</text>
  <line x1="420" y1="568" x2="769" y2="568" stroke="#DDEAFF" stroke-width="1"/>
  <circle cx="428" cy="584" r="3.5" fill="#0C5CAC"/>
  <text x="438" y="588" fill="#333" font-size="10" font-weight="600">Complete all fields: logo, banner, about, specialties, URL</text>
  <circle cx="428" cy="602" r="3.5" fill="#0C5CAC"/>
  <text x="438" y="606" fill="#333" font-size="10" font-weight="600">Employee advocacy = highest-leverage tactic for any Page</text>
  <circle cx="428" cy="620" r="3.5" fill="#0C5CAC"/>
  <text x="438" y="624" fill="#333" font-size="10" font-weight="600">Page organic reach is limited — people must amplify it</text>
  <rect x="420" y="638" width="348" height="22" rx="6" fill="#EDF3FF"/>
  <text x="594" y="653" text-anchor="middle" fill="#0C5CAC" font-size="9.5" font-weight="700">Jobs/Careers section current = signals active growth to prospects</text>

  <!-- ================================================ -->
  <!-- ROW 4                                            -->
  <!-- ================================================ -->

  <!-- CARD 7: Advertising and Sponsored Content -->
  <rect x="20" y="678" width="372" height="148" rx="10" fill="white" filter="url(#card-shadow)"/>
  <rect x="20" y="678" width="5" height="148" rx="2.5" fill="#0E5296"/>
  <circle cx="63" cy="702" r="18" fill="#0E5296"/>
  <text x="63" y="708" text-anchor="middle" fill="white" font-size="14" font-weight="700">7</text>
  <text x="89" y="698" fill="#1A1A1A" font-size="13" font-weight="700">Advertising &amp; Sponsored Content</text>
  <text x="89" y="714" fill="#0E5296" font-size="8.5" font-weight="700" letter-spacing="0.6">LINKEDIN ADS &amp; CAMPAIGN MANAGER</text>
  <line x1="32" y1="726" x2="381" y2="726" stroke="#DDEAFF" stroke-width="1"/>
  <circle cx="40" cy="742" r="3.5" fill="#0E5296"/>
  <text x="50" y="746" fill="#333" font-size="10" font-weight="600">Formats: Sponsored Content, Message Ads, Dynamic Ads</text>
  <circle cx="40" cy="760" r="3.5" fill="#0E5296"/>
  <text x="50" y="764" fill="#333" font-size="10" font-weight="600">Target by job title, company, seniority, skills — B2B precision</text>
  <circle cx="40" cy="778" r="3.5" fill="#0E5296"/>
  <text x="50" y="782" fill="#333" font-size="10" font-weight="600">Lead Gen Forms convert better than external landing pages</text>
  <rect x="32" y="796" width="348" height="22" rx="6" fill="#EEF2FF"/>
  <text x="206" y="811" text-anchor="middle" fill="#0E5296" font-size="9.5" font-weight="700">Start small: one clear objective + a modest test budget first</text>

  <!-- CARD 8: Analytics and Reporting -->
  <rect x="408" y="678" width="372" height="148" rx="10" fill="white" filter="url(#card-shadow)"/>
  <rect x="408" y="678" width="5" height="148" rx="2.5" fill="#104880"/>
  <circle cx="451" cy="702" r="18" fill="#104880"/>
  <text x="451" y="708" text-anchor="middle" fill="white" font-size="14" font-weight="700">8</text>
  <text x="477" y="698" fill="#1A1A1A" font-size="13" font-weight="700">Analytics &amp; Reporting</text>
  <text x="477" y="714" fill="#104880" font-size="8.5" font-weight="700" letter-spacing="0.6">METRICS THAT ACTUALLY MATTER</text>
  <line x1="420" y1="726" x2="769" y2="726" stroke="#DDEAFF" stroke-width="1"/>
  <circle cx="428" cy="742" r="3.5" fill="#104880"/>
  <text x="438" y="746" fill="#333" font-size="10" font-weight="600">Post demographics: which job titles actually saw your content</text>
  <circle cx="428" cy="760" r="3.5" fill="#104880"/>
  <text x="438" y="764" fill="#333" font-size="10" font-weight="600">Track inbound messages + relevant connections, not just likes</text>
  <circle cx="428" cy="778" r="3.5" fill="#104880"/>
  <text x="438" y="782" fill="#333" font-size="10" font-weight="600">Ads: cost per qualified lead — not just cost per click</text>
  <rect x="420" y="796" width="348" height="22" rx="6" fill="#EBF0FF"/>
  <text x="594" y="811" text-anchor="middle" fill="#104880" font-size="9.5" font-weight="700">Monthly review beats daily vanity stat checking every time</text>

