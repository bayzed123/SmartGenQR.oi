  <text x="133" y="163" text-anchor="middle" fill="rgba(255,255,255,0.80)" font-size="10.5">Members Worldwide</text>

  <line x1="266" y1="127" x2="266" y2="168" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>

  <text x="400" y="144" text-anchor="middle" fill="white" font-size="19" font-weight="700">4 of 5</text>
  <text x="400" y="163" text-anchor="middle" fill="rgba(255,255,255,0.80)" font-size="10.5">Members Drive Business Decisions</text>

  <line x1="533" y1="127" x2="533" y2="168" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>

  <text x="667" y="144" text-anchor="middle" fill="white" font-size="19" font-weight="700">80%</text>
  <text x="667" y="163" text-anchor="middle" fill="rgba(255,255,255,0.80)" font-size="10.5">of B2B Social Media Leads</text>

  <!-- ================================================ -->
  <!-- SECTION LABEL                                    -->
  <!-- ================================================ -->
  <text x="400" y="196" text-anchor="middle" fill="#4A6A9C" font-size="9.5" letter-spacing="2.5" font-weight="700">8 PILLARS OF LINKEDIN MARKETING SUCCESS</text>

  <!--
    CARD GRID — 2 columns × 4 rows
    Left  col: x=20,  width=372
    Right col: x=408, width=372
    Row Y starts: 204 | 362 | 520 | 678
    Card height: 148px   Row gap: 10px
  -->

  <!-- ================================================ -->
  <!-- ROW 1                                            -->
  <!-- ================================================ -->

  <!-- CARD 1: Introduction to LinkedIn Marketing -->
  <rect x="20" y="204" width="372" height="148" rx="10" fill="white" filter="url(#card-shadow)"/>
  <rect x="20" y="204" width="5" height="148" rx="2.5" fill="#0A66C2"/>
  <circle cx="63" cy="228" r="18" fill="#0A66C2"/>
  <text x="63" y="234" text-anchor="middle" fill="white" font-size="14" font-weight="700">1</text>
  <text x="89" y="224" fill="#1A1A1A" font-size="13" font-weight="700">Introduction to LinkedIn Marketing</text>
  <text x="89" y="240" fill="#0A66C2" font-size="8.5" font-weight="700" letter-spacing="0.6">PLATFORM OVERVIEW &amp; WHY IT MATTERS</text>
  <line x1="32" y1="252" x2="381" y2="252" stroke="#DDEAFF" stroke-width="1"/>
  <circle cx="40" cy="268" r="3.5" fill="#0A66C2"/>
  <text x="50" y="272" fill="#333" font-size="10" font-weight="600">Professional intent platform — users come to do business</text>
  <circle cx="40" cy="286" r="3.5" fill="#0A66C2"/>
  <text x="50" y="290" fill="#333" font-size="10" font-weight="600">1B+ members in 200+ countries — world's largest pro network</text>
  <circle cx="40" cy="304" r="3.5" fill="#0A66C2"/>
  <text x="50" y="308" fill="#333" font-size="10" font-weight="600">Best for: B2B, recruiting, personal branding, consulting</text>
  <rect x="32" y="322" width="348" height="22" rx="6" fill="#EEF4FF"/>
  <text x="206" y="337" text-anchor="middle" fill="#0A66C2" font-size="9.5" font-weight="700">Personal profiles reach 5–6× more people than Company Pages</text>

  <!-- CARD 2: Individual vs. Company Profile -->
  <rect x="408" y="204" width="372" height="148" rx="10" fill="white" filter="url(#card-shadow)"/>
  <rect x="408" y="204" width="5" height="148" rx="2.5" fill="#0C5CAC"/>
  <circle cx="451" cy="228" r="18" fill="#0C5CAC"/>
  <text x="451" y="234" text-anchor="middle" fill="white" font-size="14" font-weight="700">2</text>
  <text x="477" y="224" fill="#1A1A1A" font-size="13" font-weight="700">Individual vs. Company Profile</text>
  <text x="477" y="240" fill="#0C5CAC" font-size="8.5" font-weight="700" letter-spacing="0.6">CHOOSING THE RIGHT PRESENCE</text>
  <line x1="420" y1="252" x2="769" y2="252" stroke="#DDEAFF" stroke-width="1"/>
  <circle cx="428" cy="268" r="3.5" fill="#0C5CAC"/>
  <text x="438" y="272" fill="#333" font-size="10" font-weight="600">Individual: personal voice, up to 30,000 connections</text>
  <circle cx="428" cy="286" r="3.5" fill="#0C5CAC"/>
  <text x="438" y="290" fill="#333" font-size="10" font-weight="600">Company Page: brand home base, jobs, ads — less organic reach</text>
  <circle cx="428" cy="304" r="3.5" fill="#0C5CAC"/>
  <text x="438" y="308" fill="#333" font-size="10" font-weight="600">Strategy: Page = credibility · Personal profiles = reach engine</text>
  <rect x="420" y="322" width="348" height="22" rx="6" fill="#EDF3FF"/>
  <text x="594" y="337" text-anchor="middle" fill="#0C5CAC" font-size="9.5" font-weight="700">Company Page = legitimacy · People = organic reach engine</text>

  <!-- ================================================ -->
  <!-- ROW 2                                            -->
  <!-- ================================================ -->

  <!-- CARD 3: Building a Strong LinkedIn Profile -->
  <rect x="20" y="362" width="372" height="148" rx="10" fill="white" filter="url(#card-shadow)"/>
  <rect x="20" y="362" width="5" height="148" rx="2.5" fill="#0E5296"/>
  <circle cx="63" cy="386" r="18" fill="#0E5296"/>
  <text x="63" y="392" text-anchor="middle" fill="white" font-size="14" font-weight="700">3</text>
  <text x="89" y="382" fill="#1A1A1A" font-size="13" font-weight="700">Building a Strong LinkedIn Profile</text>
  <text x="89" y="398" fill="#0E5296" font-size="8.5" font-weight="700" letter-spacing="0.6">PROFILE OPTIMIZATION A TO Z</text>
  <line x1="32" y1="410" x2="381" y2="410" stroke="#DDEAFF" stroke-width="1"/>
  <circle cx="40" cy="426" r="3.5" fill="#0E5296"/>
  <text x="50" y="430" fill="#333" font-size="10" font-weight="600">Headline: What you do + who you help + the outcome created</text>
  <circle cx="40" cy="444" r="3.5" fill="#0E5296"/>
  <text x="50" y="448" fill="#333" font-size="10" font-weight="600">About: First person, hook opening + clear CTA at the close</text>
  <circle cx="40" cy="462" r="3.5" fill="#0E5296"/>
  <text x="50" y="466" fill="#333" font-size="10" font-weight="600">Featured section: Pin your strongest post, article, or case study</text>
  <rect x="32" y="480" width="348" height="22" rx="6" fill="#EEF2FF"/>
  <text x="206" y="495" text-anchor="middle" fill="#0E5296" font-size="9.5" font-weight="700">Recommendations from others outweigh any self-written claim</text>

  <!-- CARD 4: Content Marketing on LinkedIn -->
  <rect x="408" y="362" width="372" height="148" rx="10" fill="white" filter="url(#card-shadow)"/>
  <rect x="408" y="362" width="5" height="148" rx="2.5" fill="#104880"/>
  <circle cx="451" cy="386" r="18" fill="#104880"/>
  <text x="451" y="392" text-anchor="middle" fill="white" font-size="14" font-weight="700">4</text>
  <text x="477" y="382" fill="#1A1A1A" font-size="13" font-weight="700">Content Marketing on LinkedIn</text>
  <text x="477" y="398" fill="#104880" font-size="8.5" font-weight="700" letter-spacing="0.6">FORMATS, ALGORITHM &amp; STRATEGY</text>
  <line x1="420" y1="410" x2="769" y2="410" stroke="#DDEAFF" stroke-width="1"/>
  <circle cx="428" cy="426" r="3.5" fill="#104880"/>
  <text x="438" y="430" fill="#333" font-size="10" font-weight="600">Document carousels = consistently highest organic reach format</text>
  <circle cx="428" cy="444" r="3.5" fill="#104880"/>
  <text x="438" y="448" fill="#333" font-size="10" font-weight="600">Dwell time + first-hour comments signal quality to algorithm</text>
  <circle cx="428" cy="462" r="3.5" fill="#104880"/>
  <text x="438" y="466" fill="#333" font-size="10" font-weight="600">3–4 content pillars and rotate — consistency beats volume</text>
  <rect x="420" y="480" width="348" height="22" rx="6" fill="#EBF0FF"/>
  <text x="594" y="495" text-anchor="middle" fill="#104880" font-size="9.5" font-weight="700">3–5 hashtags · Reply every comment in the first hour</text>

  <!-- ================================================ -->
  <!-- ROW 3                                            -->
  <!-- ================================================ -->

  <!-- CARD 5: Building and Engaging Your Network -->
