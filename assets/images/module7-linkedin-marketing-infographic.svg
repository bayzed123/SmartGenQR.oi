  <text x="601" y="883" text-anchor="middle" fill="#5BA8FF" font-size="9" font-weight="700">ADVERTISE</text>
  <text x="601" y="896" text-anchor="middle" fill="#7A90A6" font-size="8">Paid Campaigns</text>
