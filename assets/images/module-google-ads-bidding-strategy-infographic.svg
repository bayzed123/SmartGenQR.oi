<svg width="1300" height="820" viewBox="0 0 1300 820" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1526"/>
      <stop offset="100%" stop-color="#1B2A4A"/>
    </linearGradient>
  </defs>
  <rect width="1300" height="820" fill="url(#bgGradB)"/>

  <text x="650" y="56" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" fill="#F6F1E4">Choosing the Right Bidding Strategy</text>
  <text x="650" y="86" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="15" fill="#93A0C2">Start with your real goal, not the fanciest-sounding option</text>

  <!-- start node -->
  <rect x="480" y="120" width="340" height="70" rx="16" fill="#1B2540" stroke="#F2A93B" stroke-width="3"/>
  <text x="650" y="163" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F6F1E4">WHAT'S YOUR MAIN GOAL?</text>

  <!-- branch lines -->
  <path d="M550,190 C450,240 220,240 195,280" fill="none" stroke="#3A4A72" stroke-width="2"/>
  <path d="M600,190 C520,250 470,250 440,280" fill="none" stroke="#3A4A72" stroke-width="2"/>
  <path d="M650,190 L650,280" fill="none" stroke="#3A4A72" stroke-width="2"/>
  <path d="M700,190 C780,250 830,250 860,280" fill="none" stroke="#3A4A72" stroke-width="2"/>
  <path d="M750,190 C950,240 1080,240 1105,280" fill="none" stroke="#3A4A72" stroke-width="2"/>

  <!-- Card 1: Maximize Clicks -->
  <rect x="60" y="290" width="270" height="220" rx="14" fill="#1B2540" stroke="#4ED9AE" stroke-width="2.5"/>
  <text x="195" y="326" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="13" fill="#93A0C2">GOAL: TRAFFIC &amp; AWARENESS</text>
  <text x="195" y="360" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#4ED9AE">Maximize Clicks</text>
  <line x1="90" y1="380" x2="300" y2="380" stroke="#2E3B5E"/>
  <text x="195" y="406" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="12.5" fill="#C7CFE3">Gets as many visits as your</text>
  <text x="195" y="424" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="12.5" fill="#C7CFE3">budget allows, fast</text>
  <text x="195" y="470" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5E6D92">Best for new campaigns still</text>
  <text x="195" y="486" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5E6D92">gathering early data</text>

  <!-- Card 2: Maximize Conversions -->
  <rect x="350" y="290" width="270" height="220" rx="14" fill="#1B2540" stroke="#F2A93B" stroke-width="2.5"/>
  <text x="485" y="326" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="13" fill="#93A0C2">GOAL: MORE CONVERSIONS</text>
  <text x="485" y="360" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F2A93B">Maximize Conversions</text>
  <line x1="380" y1="380" x2="590" y2="380" stroke="#2E3B5E"/>
  <text x="485" y="406" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="12.5" fill="#C7CFE3">Automatically bids to get</text>
  <text x="485" y="424" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="12.5" fill="#C7CFE3">the most key events total</text>
  <text x="485" y="470" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5E6D92">Needs reliable conversion</text>
  <text x="485" y="486" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5E6D92">tracking already in place</text>

  <!-- Card 3: Target CPA -->
  <rect x="640" y="290" width="270" height="220" rx="14" fill="#1B2540" stroke="#F1633C" stroke-width="2.5"/>
  <text x="775" y="326" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="13" fill="#93A0C2">GOAL: CONTROLLED COST</text>
  <text x="775" y="360" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F1633C">Target CPA</text>
  <line x1="670" y1="380" x2="880" y2="380" stroke="#2E3B5E"/>
  <text x="775" y="406" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="12.5" fill="#C7CFE3">Aims for a set average</text>
  <text x="775" y="424" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="12.5" fill="#C7CFE3">cost per conversion</text>
  <text x="775" y="470" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5E6D92">Best once you know what a</text>
  <text x="775" y="486" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5E6D92">conversion is worth to you</text>

  <!-- Card 4: Target ROAS -->
  <rect x="930" y="290" width="270" height="220" rx="14" fill="#1B2540" stroke="#4ED9AE" stroke-width="2.5"/>
  <text x="1065" y="326" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="13" fill="#93A0C2">GOAL: REVENUE EFFICIENCY</text>
  <text x="1065" y="360" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#4ED9AE">Target ROAS</text>
  <line x1="960" y1="380" x2="1170" y2="380" stroke="#2E3B5E"/>
  <text x="1065" y="406" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="12.5" fill="#C7CFE3">Aims for a set return per</text>
  <text x="1065" y="424" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="12.5" fill="#C7CFE3">rupee or dollar spent</text>
  <text x="1065" y="470" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5E6D92">Best for e-commerce with</text>
  <text x="1065" y="486" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5E6D92">real purchase value data</text>

  <!-- Card 5: Manual CPC -->
  <rect x="220" y="560" width="860" height="150" rx="14" fill="#1B2540" stroke="#F2A93B" stroke-width="2.5"/>
  <text x="650" y="596" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="13" fill="#93A0C2">GOAL: FULL MANUAL CONTROL</text>
  <text x="650" y="626" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#F2A93B">Manual CPC (with optional bid strategies)</text>
  <text x="650" y="656" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="13" fill="#C7CFE3">You set the maximum bid per click yourself for every keyword</text>
  <text x="650" y="678" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="12" fill="#5E6D92">Best for advanced advertisers who want granular, hands-on control</text>

  <text x="650" y="750" text-anchor="middle" font-family="'Trebuchet MS', Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1.5" fill="#4ED9AE" font-weight="700">SMARTGEN DIGITAL MARKETING COURSE &#183; MODULE 19</text>
</svg>
