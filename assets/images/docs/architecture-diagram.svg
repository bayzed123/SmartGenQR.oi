 <svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>

  <style>
    .box { fill:#f0f6ff; stroke:#3b82f6; stroke-width:2; rx:10; }
    .box2 { fill:#fff7ed; stroke:#f59e0b; stroke-width:2; rx:10; }
    .box3 { fill:#f0fdf4; stroke:#22c55e; stroke-width:2; rx:10; }
    .title { font-size:15px; font-weight:bold; fill:#111; }
    .sub { font-size:11px; fill:#444; }
    .arrow { stroke:#555; stroke-width:1.5; marker-end:url(#arrow); fill:none; }
    .label { font-size:16px; font-weight:bold; fill:#1e40af; }
  </style>

  <text x="300" y="30" class="label">SmartGenTools — Site Architecture</text>

  <!-- Every Page Layer -->
  <rect x="40" y="60" width="820" height="80" class="box"/>
  <text x="60" y="85" class="title">🌐 Every Page (index.html / tool pages)</text>
  <text x="60" y="105" class="sub">Loads: app.js → injectNavbar() + injectFooter() + initTheme()</text>
  <text x="60" y="122" class="sub">Requires: #main-header, #main-footer divs + absolute asset paths (/assets/...)</text>

  <!-- Arrow down -->
  <line x1="450" y1="140" x2="450" y2="175" class="arrow"/>

  <!-- Three parallel systems -->
  <rect x="40" y="180" width="250" height="110" class="box2"/>
  <text x="55" y="205" class="title">🔍 Search System</text>
  <text x="55" y="225" class="sub">search-data.js</text>
  <text x="55" y="242" class="sub">TOOLS_INDEX array:</text>
  <text x="55" y="258" class="sub">id, title, category,</text>
  <text x="55" y="272" class="sub">keywords, url, icon</text>

  <rect x="325" y="180" width="250" height="110" class="box2"/>
  <text x="340" y="205" class="title">🔗 Related Tools</text>
  <text x="340" y="225" class="sub">related-tools.js</text>
  <text x="340" y="242" class="sub">renderRelatedTools()</text>
  <text x="340" y="258" class="sub">Reads from</text>
  <text x="340" y="272" class="sub">TOOLS_INDEX (same data)</text>

  <rect x="610" y="180" width="250" height="110" class="box2"/>
  <text x="625" y="205" class="title">💬 Chatbot</text>
  <text x="625" y="225" class="sub">chatbot.js</text>
  <text x="625" y="242" class="sub">loadFAQ() → /data/faq.json</text>
  <text x="625" y="258" class="sub">loadSitemap() → sitemap.xml</text>
  <text x="625" y="272" class="sub">findBestAnswer()</text>

  <!-- connecting lines between the three -->
  <line x1="290" y1="235" x2="325" y2="235" class="arrow"/>
  <line x1="575" y1="235" x2="610" y2="235" class="arrow"/>

  <!-- Arrow down to Content Pipeline -->
  <line x1="165" y1="290" x2="165" y2="330" class="arrow"/>
  <line x1="735" y1="290" x2="735" y2="330" class="arrow"/>

  <!-- Content Pipeline -->
  <rect x="40" y="335" width="380" height="90" class="box3"/>
  <text x="55" y="360" class="title">✍️ Blog Pipeline</text>
  <text x="55" y="380" class="sub">blog-posts/*.md</text>
  <text x="55" y="397" class="sub">→ build-blog.js → blog.json</text>
  <text x="55" y="413" class="sub">Run: pnpm build-blog</text>

  <rect x="480" y="335" width="380" height="90" class="box3"/>
  <text x="495" y="360" class="title">📚 Docs Pipeline</text>
  <text x="495" y="380" class="sub">docs-post/*.md</text>
  <text x="495" y="397" class="sub">→ docs-build.js → doc pages</text>
  <text x="495" y="413" class="sub">Run: pnpm build-docs</text>

  <!-- Arrow down to Deployment -->
  <line x1="450" y1="425" x2="450" y2="465" class="arrow"/>

  <!-- Deployment -->
  <rect x="180" y="470" width="540" height="100" class="box" fill="#fdf2f8" stroke="#ec4899"/>
  <text x="200" y="495" class="title">🚀 GitHub Actions (on PR merge)</text>
  <text x="200" y="515" class="sub">1. Auto-generate data/changelog.json (never edit manually!)</text>
  <text x="200" y="533" class="sub">2. Run build scripts (blog + docs)</text>
  <text x="200" y="551" class="sub">3. Deploy to GitHub Pages → smartgentools.com</text>

  <text x="450" y="605" font-size="11" fill="#888" text-anchor="middle">
    Contributor flow: Fork → Edit files above → Test locally (npx serve) → PR
  </text>
</svg>
