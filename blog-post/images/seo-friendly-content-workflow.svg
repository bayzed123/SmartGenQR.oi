<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">SEO-friendly content workflow</title>
  <desc id="desc">A six-stage workflow showing search intent, topic planning, useful writing, on-page optimization, publication, and improvement.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a35"/>
      <stop offset="1" stop-color="#102f50"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#46d7c7"/>
      <stop offset="1" stop-color="#78a7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020817" flood-opacity=".35"/>
    </filter>
    <style>
      .title { font: 700 42px Inter, Arial, sans-serif; fill: #f8fbff; }
      .subtitle { font: 400 19px Inter, Arial, sans-serif; fill: #b6c9df; }
      .step { font: 700 18px Inter, Arial, sans-serif; fill: #071a35; }
      .label { font: 700 20px Inter, Arial, sans-serif; fill: #f8fbff; }
      .small { font: 400 15px Inter, Arial, sans-serif; fill: #c5d5e8; }
      .number { font: 700 21px Inter, Arial, sans-serif; fill: #071a35; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>
  <rect width="1400" height="780" rx="32" fill="url(#bg)"/>
  <circle cx="1260" cy="95" r="180" fill="#235f80" opacity=".2"/>
  <circle cx="90" cy="700" r="220" fill="#1a7b80" opacity=".16"/>
  <text x="90" y="92" class="title">A practical SEO-friendly content workflow</text>
  <text x="90" y="132" class="subtitle">Make valuable information easier for the right people to find, understand, and use.</text>

  <path d="M266 355 H318 M486 355 H538 M706 355 H758 M926 355 H978 M1146 355 H1192" stroke="#6c92ba" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 12"/>
  <path d="M1190 345 l18 10 -18 10" fill="none" stroke="#6c92ba" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="70" y="250" width="196" height="210" rx="24" fill="#f8fbff"/>
    <circle cx="120" cy="302" r="25" fill="url(#accent)"/><text x="120" y="302" class="number">1</text>
    <text x="95" y="365" class="step">Understand</text>
    <text x="95" y="393" class="step">search intent</text>
    <text x="95" y="428" class="small" fill="#36516e">Start with the</text>
    <text x="95" y="448" class="small" fill="#36516e">reader’s problem.</text>

    <rect x="290" y="250" width="196" height="210" rx="24" fill="#f8fbff"/>
    <circle cx="340" cy="302" r="25" fill="url(#accent)"/><text x="340" y="302" class="number">2</text>
    <text x="315" y="365" class="step">Plan the</text>
    <text x="315" y="393" class="step">topic</text>
    <text x="315" y="428" class="small" fill="#36516e">Choose a focused</text>
    <text x="315" y="448" class="small" fill="#36516e">keyword set.</text>

    <rect x="510" y="250" width="196" height="210" rx="24" fill="#f8fbff"/>
    <circle cx="560" cy="302" r="25" fill="url(#accent)"/><text x="560" y="302" class="number">3</text>
    <text x="535" y="365" class="step">Write a</text>
    <text x="535" y="393" class="step">complete answer</text>
    <text x="535" y="428" class="small" fill="#36516e">Use examples,</text>
    <text x="535" y="448" class="small" fill="#36516e">clarity, and proof.</text>

    <rect x="730" y="250" width="196" height="210" rx="24" fill="#f8fbff"/>
    <circle cx="780" cy="302" r="25" fill="url(#accent)"/><text x="780" y="302" class="number">4</text>
    <text x="755" y="365" class="step">Optimize</text>
    <text x="755" y="393" class="step">the page</text>
    <text x="755" y="428" class="small" fill="#36516e">Improve titles,</text>
    <text x="755" y="448" class="small" fill="#36516e">links, and images.</text>

    <rect x="950" y="250" width="196" height="210" rx="24" fill="#f8fbff"/>
    <circle cx="1000" cy="302" r="25" fill="url(#accent)"/><text x="1000" y="302" class="number">5</text>
    <text x="975" y="365" class="step">Publish</text>
    <text x="975" y="393" class="step">with confidence</text>
    <text x="975" y="428" class="small" fill="#36516e">Check access,</text>
    <text x="975" y="448" class="small" fill="#36516e">accuracy, and UX.</text>

    <rect x="1170" y="250" width="196" height="210" rx="24" fill="#f8fbff"/>
    <circle cx="1220" cy="302" r="25" fill="url(#accent)"/><text x="1220" y="302" class="number">6</text>
    <text x="1195" y="365" class="step">Improve</text>
    <text x="1195" y="393" class="step">from evidence</text>
    <text x="1195" y="428" class="small" fill="#36516e">Review queries,</text>
    <text x="1195" y="448" class="small" fill="#36516e">clicks, and use.</text>
  </g>

  <rect x="260" y="575" width="880" height="82" rx="41" fill="#153e61" stroke="#3c7899" stroke-width="2"/>
  <circle cx="314" cy="616" r="18" fill="#46d7c7"/>
  <path d="M305 616 l7 7 13 -16" fill="none" stroke="#071a35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="350" y="610" class="label">The goal is not to write for an algorithm.</text>
  <text x="350" y="636" class="small">The goal is to make a useful answer discoverable and easy to act on.</text>
</svg>
