[book]
title = "SmartGen Documentation"
authors = ["Sayad Md Bayezid Hosan"]
description = "Official documentation, guides, and API references for the SmartGen QR Code Generator."
language = "en"
multilingual = false

# Source folder (must match repo)
src = "src"

[build]
build-dir = "book"
create-missing = true

[output.html]
mathjax-support = false
search = true
default-theme = "light"
preferred-dark-theme = "navy"

# GitHub integration
git-repository-url = "https://github.com/bayzed123/SmartGenQR.oi"
git-repository-icon = "github"

# Edit button (important for docs workflow)
edit-url-template = "https://github.com/bayzed123/SmartGenQR.oi/edit/main/src/{path}"

[output.html.print]
enable = true

[output.html.fold]
enable = true
level = 1