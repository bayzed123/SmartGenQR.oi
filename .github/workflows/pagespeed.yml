name: Update PageSpeed Metrics

on:
  schedule:
    - cron: '0 0 * * 0' # Runs every Sunday at midnight
  workflow_dispatch:    # Allows manual execution

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install requests
        
      - name: Run PageSpeed Audit
        env:
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
        run: |
          # Generate JSON report for the main site
          python3 scripts/pagespeed.py https://smartgentools.com --strategy mobile --json > report.json
          
      - name: Update README.md
        run: |
          python3 -c "
          import json, re
          try:
              with open('report.json', 'r') as f: data = json.load(f)
              score = data.get('performance_score', 'N/A')
              
              report = f'\n### 🚀 Performance Metrics (Last Updated: $(date +%Y-%m-%d))\n**Performance Score:** {score}/100\n'
              
              with open('README.md', 'r') as f: content = f.read()
              
              # Regex to find the placeholders in README
              new_content = re.sub(r'<!-- pagespeed_start -->.*?<!-- pagespeed_end -->', 
                                   f'<!-- pagespeed_start -->{report}<!-- pagespeed_end -->', 
                                   content, flags=re.DOTALL)
              
              with open('README.md', 'w') as f: f.write(new_content)
          except Exception as e:
              print(f'Error updating README: {e}')
          "
          
      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          # Only commit if there are actual changes
          git diff --quiet && git diff --staged --quiet || (git commit -m 'chore: update pagespeed performance metrics' && git push)