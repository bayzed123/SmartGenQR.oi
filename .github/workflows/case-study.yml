name: Case Study Bot

# Runs on every push to any branch. paths-ignore on CASE_STUDY.md is
# load-bearing, not optional — without it, this workflow's own commit
# (which updates CASE_STUDY.md) would trigger itself again, forever.
"on":
  push:
    branches:
      - "**"
    paths-ignore:
      - "CASE_STUDY.md"

# contents: write is required so the bot can commit the updated case
# study back to the repository using the automatically-provided
# GITHUB_TOKEN — no extra secret needs to be created for this to work.
permissions:
  contents: write

jobs:
  update-case-study:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          # Full history, not a shallow clone — the bot diffs between
          # arbitrary before/after commits, including a repo's very
          # first commit, and a shallow clone can make that diff fail.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run case study bot
        run: python case_study_bot.py

      - name: Commit updated case study
        run: |
          git config user.name "case-study-bot"
          git config user.email "actions@users.noreply.github.com"
          git add CASE_STUDY.md
          # If the bot produced no actual change (e.g. an edge-case
          # push with nothing to diff), skip the commit instead of
          # failing the workflow on "nothing to commit".
          if git diff --cached --quiet; then
            echo "No case study changes to commit."
          else
            git commit -m "Update case study [skip ci]"
            git push
          fi
