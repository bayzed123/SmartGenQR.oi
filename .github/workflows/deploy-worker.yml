name: Deploy SmartGen Platforms Worker

# Deploys the Cloudflare Worker that powers the SEO Audit Tool and the AI
# assistant. This is the one place GitHub secrets are legitimate: they are used
# inside the runner to authenticate `wrangler deploy` and are never written
# into any file the site serves.
#
# All of the names below are repository SECRETS, added under
# Settings → Secrets and variables → Actions → Secrets → New repository secret.
# A value added under the neighbouring *Variables* tab is stored in plain text
# and is not readable through ${{ secrets.* }} — the deploy detects that mistake
# by name and fails rather than skipping quietly.
#
# Required to deploy at all:
#   CLOUDFLARE_API_TOKEN   token with "Edit Cloudflare Workers" permission
#   CLOUDFLARE_ACCOUNT_ID  your account id
#
# Required for accounts and premium access. The deploy fails unless Cloudflare
# holds all four — setting them here is the easy way, but a value you put in
# Cloudflare directly with `wrangler secret put` counts just as well, and an
# absence here then only produces a warning:
#   SESSION_SECRET         signs session tokens; 32+ random bytes, e.g.
#                          `openssl rand -base64 48`
#   ADMIN_TOKEN            authorises the Premium Access workflow
#   SEO_ADMIN_USERNAME     owner login — unlimited audits
#   SEO_ADMIN_PASSWORD
#
# Optional — set these and the deploy will also push them into Cloudflare's
# secret store for you, so you never have to install wrangler locally:
#   GEMINI_API_KEY
#   GOOGLE_SERVICE_ACCOUNT_JSON   the whole .json on one line
#   LEADS_SHEET_ID
#   PAGESPEED_API_KEY
#   GOOGLE_CSE_API_KEY            Google Custom Search JSON API key (rank checker)
#   GOOGLE_CSE_ID                 Programmable Search Engine id ("cx") — create one at
#                                 https://programmablesearchengine.google.com/
#                                 with "Search the entire web" turned on
#   PREMIUM_UNLOCK_SECRET
#
# These are safe as GitHub secrets because they are only ever read inside this
# runner and piped straight into `wrangler secret put`. They are never written
# into a file the website serves — that distinction is the whole point. An
# unset secret is skipped, leaving whatever Cloudflare already holds.

on:
  push:
    branches: [main]
    paths:
      - 'backend/smartgen-platforms/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

concurrency:
  group: deploy-smartgen-platforms
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        working-directory: backend/smartgen-platforms
        run: npm install --no-audit --no-fund

      - name: Run tests
        working-directory: backend/smartgen-platforms
        run: npm test

      - name: Verify the chatbot knowledge index is in sync
        run: |
          node scripts/build-chatbot-knowledge.js
          if ! git diff --quiet -- backend/smartgen-platforms/src/knowledge/site-index.js; then
            echo "::error::The chatbot knowledge index is stale. Run 'npm run build-chatbot' and commit the result."
            git diff --stat -- backend/smartgen-platforms/src/knowledge/site-index.js
            exit 1
          fi
          echo "Knowledge index matches the site."

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    # Skip cleanly on forks, which have no access to the secrets.
    if: github.repository == 'bayzed123/SmartGenQR.oi'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        working-directory: backend/smartgen-platforms
        run: npm install --no-audit --no-fund

      - name: Deploy to Cloudflare
        working-directory: backend/smartgen-platforms
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # Idempotent: re-running simply re-sets the same values. Secrets that are
      # not configured in GitHub are skipped, so this never clears anything.
      - name: Sync application secrets into Cloudflare
        working-directory: backend/smartgen-platforms
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          LEADS_SHEET_ID: ${{ secrets.LEADS_SHEET_ID }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          PREMIUM_UNLOCK_SECRET: ${{ secrets.PREMIUM_UNLOCK_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          SEO_ADMIN_USERNAME: ${{ secrets.SEO_ADMIN_USERNAME }}
          SEO_ADMIN_PASSWORD: ${{ secrets.SEO_ADMIN_PASSWORD }}
          # Whether the same name also exists in the *variables* store — the
          # comparison yields the string "true"/"false", never the value.
          # Passing ${{ vars.X }} itself would be a leak: the runner prints this
          # env block into the log, and it masks secrets but not variables.
          VAR_SET_ADMIN_TOKEN: ${{ vars.ADMIN_TOKEN != '' }}
          VAR_SET_SESSION_SECRET: ${{ vars.SESSION_SECRET != '' }}
          VAR_SET_SEO_ADMIN_USERNAME: ${{ vars.SEO_ADMIN_USERNAME != '' }}
          VAR_SET_SEO_ADMIN_PASSWORD: ${{ vars.SEO_ADMIN_PASSWORD != '' }}
        run: |
          set -euo pipefail

          wrong_store_used=0

          # A value put in Settings → Actions → *Variables* is invisible to
          # ${{ secrets.* }}, so the sync below silently skips it and the Worker
          # boots without the feature. Say so instead of shrugging.
          wrong_store() {
            name="$1"
            if [ "$(printenv "VAR_SET_$name" || true)" = "true" ]; then
              echo "::error::$name exists as an Actions *variable*, not a secret. Variables are stored in plain text and are not readable via secrets.$name, so nothing was synced. Delete the variable, then add $name under Settings → Secrets and variables → Actions → Secrets → New repository secret. Treat the value you used as compromised and generate a fresh one."
              return 1
            fi
            return 0
          }

          # An absent secret is not by itself a failure: a value can legitimately
          # have been set straight in Cloudflare with `wrangler secret put`, and
          # this workflow's contract has always been "unset here, leave Cloudflare
          # alone". Whether Cloudflare actually holds it is a question only
          # Cloudflare can answer, so it is asked in the next step rather than
          # guessed at here. required=yes only changes a note into a warning.
          sync() {
            name="$1"
            required="${2:-no}"
            value="$(printenv "$name" || true)"

            if [ -z "$value" ]; then
              wrong_store "$name" || { wrong_store_used=1; return 0; }
              if [ "$required" = "yes" ]; then
                echo "::warning::$name is not in GitHub secrets, so nothing was synced. Cloudflare must already hold it — the next step checks."
              else
                echo "· $name — not set in GitHub secrets, leaving Cloudflare as-is"
              fi
              return 0
            fi

            # printf, not echo: no trailing newline gets stored with the value.
            # stdout is dropped because wrangler echoes back the name; stderr is
            # kept so a real failure is readable. The exit status is what counts:
            # this step used to print a tick unconditionally, which is how four
            # never-stored secrets sat unnoticed through a dozen green deploys.
            if printf '%s' "$value" | npx wrangler secret put "$name" >/dev/null; then
              echo "✓ $name — stored in Cloudflare"
            else
              echo "::error::wrangler secret put $name failed. See the error above."
              return 1
            fi
          }

          sync GEMINI_API_KEY
          sync GOOGLE_SERVICE_ACCOUNT_JSON
          sync LEADS_SHEET_ID
          sync PAGESPEED_API_KEY
          sync GOOGLE_CSE_API_KEY
          sync GOOGLE_CSE_ID
          sync ADMIN_TOKEN yes
          sync PREMIUM_UNLOCK_SECRET
          sync SESSION_SECRET yes
          sync SEO_ADMIN_USERNAME yes
          sync SEO_ADMIN_PASSWORD yes

          if [ "$wrong_store_used" -ne 0 ]; then
            echo "::error::A value was added under Actions → Variables instead of Actions → Secrets. Move it, then re-run this workflow."
            exit 1
          fi

      # Names only — `wrangler secret list` never returns values. This is the
      # step that answers "is it actually in Cloudflare?" without guessing from
      # the sync log, and it is the gate for the required names. It runs even
      # when the sync step failed, because Cloudflare's actual state is exactly
      # what you want to see when something above went wrong.
      - name: Verify the Worker's secrets are present in Cloudflare
        if: '!cancelled()'
        working-directory: backend/smartgen-platforms
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler secret list > secrets.json
          node -e '
            // Some wrangler versions print a banner above the JSON, so start at
            // the first bracket rather than assuming the file is pure JSON. An
            // error line can contain a bracket too ("[code: 10000]"), so the
            // parse still has to be able to fail without a stack trace.
            const raw = require("fs").readFileSync("secrets.json", "utf8");
            let list = null;
            const start = raw.indexOf("[");
            if (start !== -1) {
              try { list = JSON.parse(raw.slice(start)); } catch { /* handled below */ }
            }
            if (!Array.isArray(list)) {
              console.log("::error::Could not read the secret list from wrangler. Its output was:");
              console.log(raw.trim() || "(empty)");
              process.exit(1);
            }
            const held = new Set(list.map((s) => s.name));
            const required = ["SESSION_SECRET", "ADMIN_TOKEN", "SEO_ADMIN_USERNAME", "SEO_ADMIN_PASSWORD"];
            const absent = required.filter((n) => !held.has(n));
            for (const n of required) console.log(`${held.has(n) ? "✓" : "✗"} ${n}`);
            if (absent.length) {
              console.log(
                `::error::Cloudflare does not hold ${absent.join(", ")}, so accounts and premium access stay switched off. ` +
                "Add each one under Settings → Secrets and variables → Actions → Secrets → New repository secret " +
                "(the Variables tab next to it will not work), then re-run this workflow."
              );
              process.exit(1);
            }
          '
          rm -f secrets.json

      - name: Smoke test the deployment
        env:
          # Override with a repository variable if you move the Worker to a
          # custom domain (Settings → Secrets and variables → Actions → Variables).
          WORKER_URL: ${{ vars.WORKER_URL || 'https://smartgen-platforms.sayadmdbayezidhosan.workers.dev' }}
        run: |
          echo "Checking $WORKER_URL/api/health"
          for i in 1 2 3 4 5; do
            body=$(curl -sS --max-time 20 "$WORKER_URL/api/health" || true)
            if echo "$body" | grep -q '"ok":true'; then
              echo "$body"
              exit 0
            fi
            echo "Health check attempt $i failed, retrying in $((i * 4))s…"
            sleep $((i * 4))
          done
          echo "::error::The Worker did not report healthy after deploying."
          exit 1
