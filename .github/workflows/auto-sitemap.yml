name: Auto Sitemap Generator

on:
  push:
    branches:
      - main
    paths:
      - '**/*.html'
      - 'blog-posts/**/*.md'

  schedule:
    # Runs every 12 hours
    - cron: '0 */12 * * *'

  workflow_dispatch:

# Fixes Node.js 20 deprecation warnings on GitHub Actions
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Prevent multiple workflow conflicts
concurrency:
  group: sitemap-update
  cancel-in-progress: false

jobs:
  update-sitemap:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to fetch full git history for accurate dates

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install PyYAML

      - name: Generate Clean Sitemap
        run: |
          python << 'EOF'
          import os
          import re
          import yaml
          import subprocess
          from datetime import datetime
          import xml.etree.ElementTree as ET
          from xml.dom import minidom

          BASE_URL = "https://smartgentools.com"
          SITEMAP_FILE = "sitemap.xml"
          NAMESPACE = "http://www.sitemaps.org/schemas/sitemap/0.9"
          IMAGE_NAMESPACE = "http://www.google.com/schemas/sitemap-image/1.1"

          ET.register_namespace('', NAMESPACE)
          ET.register_namespace('image', IMAGE_NAMESPACE)

          # Create URLSET root
          urlset = ET.Element(f'{{{NAMESPACE}}}urlset')

          # Store URLs uniquely
          unique_urls = {}

          # Fallback date in YYYY-MM-DD format directly using isoformat
          current_date = datetime.utcnow().date().isoformat()

          def slugify(text):
              """Generates URL-friendly slugs"""
              text = text.lower()
              text = re.sub(r'[^a-z0-9]+', '-', text)
              return text.strip('-')

          def get_git_lastmod(filepath):
              """Extracts exact git commit date directly without regex matching on 'Date:'"""
              try:
                  # --format=%cs returns the date strictly in YYYY-MM-DD format
                  git_log = subprocess.check_output(
                      ['git', 'log', '-1', '--format=%cs', '--', filepath],
                      stderr=subprocess.DEVNULL
                  ).decode('utf-8').strip()
                  
                  # Verify the output is strictly a valid YYYY-MM-DD date
                  if re.match(r'^\d{4}-\d{2}-\d{2}$', git_log):
                      return git_log
              except Exception:
                  pass
              
              # Fallback to file system modification time if not found in git
              try:
                  mtime = os.path.getmtime(filepath)
                  return datetime.utcfromtimestamp(mtime).date().isoformat()
              except Exception:
                  return current_date

          # Scan repository
          for current_root, dirs, files in os.walk('.'):

              # Ignore hidden directories
              dirs[:] = [d for d in dirs if not d.startswith('.') and d not in ('_includes', 'node_modules', 'backend')]

              for file in files:
                  full_path = os.path.join(current_root, file)
                  
                  # Normalize path
                  relative_path = os.path.relpath(full_path, '.')
                  relative_path = relative_path.replace('\\', '/')

                  # -----------------------------
                  # 1. DYNAMIC BLOG POSTS PROCESSING (.md)
                  # -----------------------------
                  if relative_path.startswith('blog-posts/') and file.endswith('.md'):
                      if file.lower() == 'readme.md':
                          continue
                          
                      title = ""
                      image_url = ""
                      published_date = ""
                      with open(full_path, 'r', encoding='utf-8') as f:
                          content = f.read()
                      
                      # Read title from Front-matter
                      match = re.match(r'^---\s*\n(.*?)\n---\s*\n', content, re.DOTALL)
                      pinned_slug = ''
                      if match:
                          try:
                              fm_data = yaml.safe_load(match.group(1)) or {}
                              title = fm_data.get('title', '')
                              image_url = fm_data.get('image', '') or ''
                              published_date = str(fm_data.get('date', '') or '')
                              pinned_slug = str(fm_data.get('slug', '') or '').strip()
                          except Exception:
                              pass

                      if not title:
                          title = file.replace('.md', '')

                      # Respect an explicit `slug:` exactly as scripts/build-blog.js
                      # does. Deriving the URL from the title here instead would
                      # silently drop every post whose title has been reworded
                      # since publication -- the generator would look for a
                      # directory that does not exist, skip it, and quietly leave
                      # the live page out of the sitemap.
                      blog_slug = pinned_slug or slugify(title)
                      clean_url = f'{BASE_URL}/blog/{blog_slug}/'
                      priority = '0.8'
                      changefreq = 'weekly'
                      
                      # The deployment workflow builds blog HTML separately and may run
                      # concurrently. Include the Markdown post now so the sitemap does not
                      # miss a newly published article during that deployment window.
                      # Preserve the article’s declared publication date when available.
                      # This prevents sitemap regeneration from changing historical dates.
                      if re.match(r'^\d{4}-\d{2}-\d{2}$', published_date):
                          lastmod_date = published_date
                      else:
                          lastmod_date = get_git_lastmod(full_path)

                      # Include the article’s declared cover image in the image sitemap.
                      # Relative image paths are resolved against the public site root.
                      if image_url and not re.match(r'^https?://', str(image_url)):
                          image_url = f'{BASE_URL}/{str(image_url).lstrip("/")}'

                  # -----------------------------
                  # 2. STATIC HTML PROCESSING
                  # -----------------------------
                  elif file.endswith('.html'):
                      if file == '404.html':
                          continue

                      # Skip generated individual blog sub-pages to prevent conflict
                      if relative_path.startswith('blog/') and relative_path != 'blog/index.html':
                          continue

                      # Skip client-side redirect stubs (e.g. legacy
                      # folder-style URLs like html-code-library/foo/index.html
                      # that just bounce to the real html-code-library/foo.html
                      # page). A sitemap should only ever list the final
                      # destination URL, never a page whose whole job is to
                      # redirect away from itself.
                      #
                      # This used to test only paths ending in /index.html, so
                      # six standalone redirect files slipped through --
                      # api/authentication.html and the five getting-started/
                      # stubs. Google crawls a submitted URL, finds a redirect,
                      # and files it under "Page with redirect" in the
                      # not-indexed report. Check every .html file instead.
                      try:
                          with open(full_path, 'r', encoding='utf-8') as rf:
                              head = rf.read(2048)
                          if 'http-equiv="refresh"' in head:
                              continue
                      except Exception:
                          pass

                      # Skip any page that names a different URL as its
                      # canonical. Submitting one of these tells Google to
                      # crawl a URL that then says "index that other one
                      # instead", and Google files it under "Alternate page
                      # with proper canonical tag" in the not-indexed report.
                      # The canonical target is itself in the sitemap, so
                      # nothing is lost by leaving the duplicate out.
                      #
                      # Note the attribute order: these files are written with
                      # attributes alphabetised, so href comes before rel. A
                      # regex assuming rel="canonical" appears first silently
                      # matches nothing.
                      try:
                          with open(full_path, 'r', encoding='utf-8') as rf:
                              page_html = rf.read()
                          declared = ''
                          for link_tag in re.findall(r'<link\b[^>]*>', page_html):
                              if re.search(r'rel\s*=\s*["\']canonical["\']', link_tag, re.I):
                                  href_match = re.search(r'href\s*=\s*["\']([^"\']+)["\']', link_tag)
                                  if href_match:
                                      declared = href_match.group(1)
                                  break
                          if declared:
                              if relative_path == 'index.html':
                                  own_url = f'{BASE_URL}/'
                              elif relative_path.endswith('/index.html'):
                                  own_url = f'{BASE_URL}/{relative_path[:-11]}/'
                              else:
                                  own_url = f'{BASE_URL}/{relative_path}'
                              if declared.rstrip('/') != own_url.rstrip('/'):
                                  continue
                      except Exception:
                          pass

                      # Skip legacy nested html-code-library pages that
                      # duplicate a flat html-code-library/<slug>.html page's
                      # content (e.g. html-code-library/character-codes/foo/
                      # index.html vs html-code-library/foo.html). These
                      # aren't redirect stubs -- they're full old copies of the
                      # same tool, left over from an earlier URL structure --
                      # so the http-equiv="refresh" check above doesn't catch
                      # them. Submitting both to Google is exactly the kind of
                      # duplicate-content pattern that gets flagged; only the
                      # flat page (their own canonical target) belongs here.
                      if relative_path.startswith('html-code-library/') and relative_path.count('/') >= 3:
                          slug = os.path.basename(current_root)
                          if os.path.exists(f'html-code-library/{slug}.html'):
                              continue

                      # Homepage
                      if relative_path == 'index.html':
                          clean_url = f'{BASE_URL}/'
                          priority = '1.0'
                          changefreq = 'weekly'

                      # Convert folder/index.html → /folder/
                      elif relative_path.endswith('/index.html'):
                          folder_path = relative_path[:-11]
                          clean_url = f'{BASE_URL}/{folder_path}/'
                          priority = '0.8'
                          changefreq = 'weekly'

                      # Normal HTML pages (standalone file, not folder/index.html).
                      # GitHub Pages serves these at their literal path — it does
                      # NOT resolve a trailing-slash folder URL for them the way it
                      # does for an index.html. Keep the .html extension instead of
                      # rewriting to a folder-style URL, or the resulting sitemap
                      # entry 404s. (This previously produced ~79 dead links under
                      # html-code-library/, e.g. .../background-color/ instead of
                      # the real .../background-color.html — confirmed by matching
                      # every entry against the checked-out file tree.)
                      else:
                          clean_url = f'{BASE_URL}/{relative_path}'
                          priority = '0.8'
                          changefreq = 'weekly'
                          
                      lastmod_date = get_git_lastmod(full_path)
                  
                  else:
                      continue

                  # -----------------------------
                  # STRICT DUPLICATE PREVENTION
                  # -----------------------------
                  # Don't force a trailing slash onto standalone .html URLs — that
                  # would silently re-break the fix above (.../foo.html would
                  # become .../foo.html/, a second dead link).
                  normalized_url = clean_url.strip()
                  if not normalized_url.endswith('.html'):
                      normalized_url = normalized_url.rstrip('/') + '/'

                  # Skip if already exists
                  if normalized_url in unique_urls:
                      continue

                  unique_urls[normalized_url] = {
                      'loc': normalized_url,
                      'lastmod': lastmod_date,
                      'changefreq': changefreq,
                      'priority': priority,
                      'image': image_url if relative_path.startswith('blog-posts/') and file.endswith('.md') else ''
                  }

          # Sort URLs alphabetically
          sorted_urls = sorted(unique_urls.values(), key=lambda x: x['loc'])

          # Create XML entries
          for item in sorted_urls:
              url_element = ET.SubElement(urlset, f'{{{NAMESPACE}}}url')
              
              loc_element = ET.SubElement(url_element, f'{{{NAMESPACE}}}loc')
              loc_element.text = item['loc']

              lastmod_element = ET.SubElement(url_element, f'{{{NAMESPACE}}}lastmod')
              lastmod_element.text = item['lastmod']

              changefreq_element = ET.SubElement(url_element, f'{{{NAMESPACE}}}changefreq')
              changefreq_element.text = item['changefreq']

              priority_element = ET.SubElement(url_element, f'{{{NAMESPACE}}}priority')
              priority_element.text = item['priority']

              if item.get('image'):
                  image_element = ET.SubElement(url_element, f'{{{IMAGE_NAMESPACE}}}image')
                  image_loc_element = ET.SubElement(image_element, f'{{{IMAGE_NAMESPACE}}}loc')
                  image_loc_element.text = item['image']

          # Generate pretty XML
          raw_xml = ET.tostring(urlset, encoding='utf-8')
          parsed_xml = minidom.parseString(raw_xml)
          pretty_xml = parsed_xml.toprettyxml(indent='  ', encoding='utf-8')

          # Remove blank lines
          pretty_xml_clean = b'\n'.join(
              line for line in pretty_xml.splitlines()
              if line.strip()
          )

          # Read old sitemap if it exists
          old_content = b''
          if os.path.exists(SITEMAP_FILE):
              with open(SITEMAP_FILE, 'rb') as old_file:
                  old_content = old_file.read()

          # Skip writing if no changes
          if old_content == pretty_xml_clean:
              print('Sitemap already clean and up to date.')
              exit(0)

          # Save sitemap.xml
          with open(SITEMAP_FILE, 'wb') as sitemap_file:
              sitemap_file.write(pretty_xml_clean)

          print(f'Sitemap generated successfully with {len(sorted_urls)} unique URLs.')
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"

          git add sitemap.xml

          # Exit if no changes detected
          if git diff --cached --quiet; then
            echo "No sitemap changes detected."
            exit 0
          fi

          # Commit changes
          git commit -m "fix(sitemap): implement direct git format extraction for precise dates"

          # Pull latest changes safely
          git pull --rebase origin main

          # Push sitemap update
          git push origin main
