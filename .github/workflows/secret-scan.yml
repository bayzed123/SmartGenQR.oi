name: Secret Scan

# This repository is public and is deployed straight to GitHub Pages, so any
# credential that lands in it is immediately downloadable by anyone. .gitignore
# stops the obvious filenames, but it can't help if a key is pasted into a
# source file or the file is renamed. This job fails the build on the patterns
# that actually matter.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan tracked files for credential material
        run: |
          set -uo pipefail
          fail=0

          # Only scan files git actually tracks — node_modules and other
          # ignored paths are irrelevant and produce noise.
          mapfile -t files < <(git ls-files)

          check() {
            local label="$1" pattern="$2"
            local hits
            # Exclude this workflow itself: it necessarily contains the patterns.
            hits=$(printf '%s\n' "${files[@]}" \
              | grep -v '^.github/workflows/secret-scan.yml$' \
              | xargs -r grep -lEI "$pattern" 2>/dev/null || true)
            if [ -n "$hits" ]; then
              echo "::error::Possible $label committed in:"
              echo "$hits" | sed 's/^/    /'
              fail=1
            fi
          }

          # A real PEM private key body, not a "-----BEGIN PRIVATE KEY-----\n...\n"
          # documentation placeholder: require >=40 chars of base64 on one line.
          check "private key"            'BEGIN [A-Z ]*PRIVATE KEY-----\\?n?[A-Za-z0-9+/]{40,}'
          check "Google API key"         'AIza[0-9A-Za-z_-]{35}'
          check "GCP service-account id" '"private_key_id"[[:space:]]*:[[:space:]]*"[0-9a-f]{40}"'
          check "AWS access key"         'AKIA[0-9A-Z]{16}'
          check "Slack token"            'xox[baprs]-[0-9A-Za-z-]{10,}'
          check "GitHub token"           'gh[pousr]_[0-9A-Za-z]{36,}'
          check "Cloudflare API token"   'CLOUDFLARE_API_TOKEN[[:space:]]*[=:][[:space:]]*["'"'"']?[0-9A-Za-z_-]{30,}'

          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "A credential appears to be committed to a PUBLIC repository."
            echo "Rotate it immediately, then remove it from the working tree."
            echo "Secrets belong in 'wrangler secret put' or GitHub Actions secrets."
            exit 1
          fi

          echo "No credential material found in tracked files."
