name: Share New Blog Posts on LinkedIn

on:
  push:
    branches:
      - main
    paths:
      - 'blog-posts/**/*.md'
  workflow_dispatch:
    inputs:
      post_path:
        description: 'Optional blog Markdown path to publish for a live test'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: linkedin-blog-share
  cancel-in-progress: false

jobs:
  share-new-posts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish newly added blog posts to LinkedIn
        env:
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_PERSON_ID: ${{ secrets.LINKEDIN_PERSON_ID }}
          LINKEDIN_MEMBER_ID: ${{ secrets.LINKEDIN_MEMBER_ID }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          LINKEDIN_POST_PATH: ${{ inputs.post_path }}
        run: node scripts/share-new-blog-posts-linkedin.js
