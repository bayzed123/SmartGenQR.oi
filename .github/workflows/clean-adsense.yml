name: Optimize AdSense Placeholders

on:
  push:
    branches:
      - main

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute Cleanup Script
        run: python scripts/remove-adsense-placeholders.py

      - name: Commit and Push Updates
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Check for changes before committing to keep Git history clean
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "chore: optimize adsense placeholders for review"
            git push
          else
            echo "No placeholders detected. Working directory clean."
          fi