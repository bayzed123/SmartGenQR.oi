<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartGen User Reviews</title>
    <style>
        /* Mobile-friendly basic styling */
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: auto; }
        nav { margin-bottom: 20px; }
        nav a { text-decoration: none; color: #007bff; font-weight: bold; }
        .review-form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 40px; }
        input, textarea, button { padding: 12px; font-size: 16px; border-radius: 6px; border: 1px solid #ccc; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:disabled { background-color: #999; cursor: not-allowed; }
        
        .review-card { border: 1px solid #ddd; padding: 15px; border-radius: 8px; margin-bottom: 15px; background: #f9f9f9; }
        .review-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .stars { color: #f5b301; font-size: 18px; }
        .review-text { margin: 0; color: #333; line-height: 1.5; }
    </style>
</head>
<body>

    <nav>
        <a href="../index.html">&larr; Back to Home</a>
    </nav>

    <h2>Leave a Review</h2>
    
    <form id="review-form" class="review-form">
        <input type="text" id="reviewer-name" placeholder="Your Name" required />
        <input type="number" id="review-rating" placeholder="Rating (1 to 5)" min="1" max="5" required />
        <textarea id="review-text" placeholder="Write your experience..." rows="4" required></textarea>
        <button type="submit" id="submit-btn">Submit Review</button>
    </form>

    <hr style="border: 1px solid #eee; margin-bottom: 30px;">

    <h2>All Reviews</h2>
    
    <div id="reviews-list">
        <p style="color: #666;">Loading real-time reviews...</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        
        // IMPORTANT: Path changed to ../config.js because this file is inside the /review folder
        import { firebaseConfig } from "../config.js";

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        // Exact collection name from your Firestore database
        const reviewsCollection = collection(db, "Smartgen Review");

        const reviewForm = document.getElementById("review-form");
        const reviewsList = document.getElementById("reviews-list");
        const submitBtn = document.getElementById("submit-btn");

        // STEP 1: Handle Review Submission (Write to Database)
        reviewForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            
            const name = document.getElementById("reviewer-name").value;
            const rating = parseInt(document.getElementById("review-rating").value);
            const text = document.getElementById("review-text").value;

            try {
                // UI feedback while submitting
                submitBtn.innerText = "Submitting...";
                submitBtn.disabled = true;

                // Send to Firestore
                await addDoc(reviewsCollection, {
                    name: name,
                    rating: rating,
                    text: text,
                    timestamp: serverTimestamp() // Firestore native time for accurate sorting
                });

                // Reset on success
                reviewForm.reset();
                submitBtn.innerText = "Submit Review";
                submitBtn.disabled = false;
                
            } catch (error) {
                console.error("Error writing document: ", error);
                alert("Something went wrong. Please try again.");
                submitBtn.innerText = "Submit Review";
                submitBtn.disabled = false;
            }
        });

        // STEP 2: Fetch and Display Reviews Dynamically (Read from Database)
        const q = query(reviewsCollection, orderBy("timestamp", "desc"));

        onSnapshot(q, (snapshot) => {
            reviewsList.innerHTML = ""; // Clear loader text

            if (snapshot.empty) {
                reviewsList.innerHTML = "<p style='color: #666;'>No reviews yet. Be the first to share your experience!</p>";
                return;
            }
            
            snapshot.forEach((doc) => {
                const data = doc.data();
                
                // Create a star string based on rating (e.g., 4 = ★★★★☆)
                const activeStars = "★".repeat(data.rating || 5);
                const inactiveStars = "☆".repeat(5 - (data.rating || 5));
                
                // Build HTML element
                const card = document.createElement("div");
                card.className = "review-card";
                card.innerHTML = `
                    <div class="review-header">
                        <strong>${data.name}</strong>
                        <span class="stars">${activeStars}${inactiveStars}</span>
                    </div>
                    <p class="review-text">${data.text}</p>
                `;
                
                reviewsList.appendChild(card);
            });
        });
    </script>
</body>
</html>
