<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <link rel="preconnect" href="https://www.googletagmanager.com">
    <link rel="preconnect" href="https://pagead2.googlesyndication.com">
    <link rel="preconnect" href="https://fundingchoicesmessages.google.com">
    <link rel="preload" href="../assets/css/style.css" as="style" onload="this.rel='stylesheet'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="SAMEORIGIN">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
  <title>User Reviews - SmartGen Tools</title>
  <!-- Reuses your existing stylesheets -->
  <link rel="stylesheet" href="../assets/css/style.css"> 
</head>
<body>

  <div class="container">
    <h1>Submit a Review</h1>
    <form id="reviewForm">
      <input type="text" id="username" placeholder="Your Name" required><br><br>
      <input type="number" id="rating" placeholder="Rating (1-5)" min="1" max="5" required><br><br>
      <textarea id="comment" placeholder="Write your review here..." required></textarea><br><br>
      <button type="submit">Submit Review</button>
    </form>

    <hr>

    <h2>What Our Users Say</h2>
    <div id="reviewsList">Loading reviews...</div>
  </div>

  <!-- Firebase JavaScript SDK (ES Modules CDN Placeholders) -->
  <script type="module">
    // Replace these placeholder strings with your actual Firebase SDK CDN URLs
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"; 
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } 
      from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

    // Your Firebase Configuration (From SmartGen Review db)
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY", 
      authDomain: "smartgen-review-db.firebaseapp.com",
      projectId: "smartgen-review-db",
      messagingSenderId: "326618655365",
      appId: "YOUR_APP_ID"
    };

    // Initialize Firebase and Firestore
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const reviewsRef = collection(db, "reviews");

    const reviewForm = document.getElementById("reviewForm");
    const reviewsList = document.getElementById("reviewsList");

    // 1. Listen for new reviews and display them instantly
    const q = query(reviewsRef, orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      reviewsList.innerHTML = ""; // Clear existing text
      if (snapshot.empty) {
        reviewsList.innerHTML = "<p>No reviews yet. Be the first to leave one!</p>";
        return;
      }
      
      snapshot.forEach((doc) => {
        const data = doc.data();
        const reviewElement = document.createElement("div");
        reviewElement.className = "review-card";
        reviewElement.innerHTML = `
          <h3>${data.username} (${data.rating}/5 ⭐)</h3>
          <p>${data.comment}</p>
          <small>${data.createdAt ? new Date(data.createdAt.seconds * 1000).toLocaleDateString() : "Just now"}</small>
        `;
        reviewsList.appendChild(reviewElement);
      });
    });

    // 2. Submit a new review when the user clicks button
    reviewForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const username = document.getElementById("username").value;
      const rating = document.getElementById("rating").value;
      const comment = document.getElementById("comment").value;

      try {
        await addDoc(reviewsRef, {
          username: username,
          rating: Number(rating),
          comment: comment,
          createdAt: new Date()
        });
        reviewForm.reset(); // Clear the input fields
      } catch (error) {
        console.error("Error writing review: ", error);
        alert("Failed to submit review. Please try again!");
      }
    });
  </script>
</body>
</html>
